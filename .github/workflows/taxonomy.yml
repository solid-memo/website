name: Taxonomy

# Once a week, bring the deck of new and changed occupation names up to the
# newest version of Arbetsförmedlingen's labor market taxonomy
# (docs/deck-library.md#the-taxonomy-deck). When the taxonomy has a version
# the deck's newest version lacks, the workflow opens an issue for it, makes
# the deck's next version with scripts/taxonomy_deck.py, checks it as CI's
# library and crosscheck jobs do, and opens a pull request that closes the
# issue, or updates the one already open. The pull request is opened with
# the taxonomy app's token, so CI runs on it like on anyone's; merging it
# through the merge queue publishes the version. A failure opens an issue.
# The version is made and checked in one job, with no secret, and pushed
# from another, which holds the app's key and runs nothing installed
# (docs/deck-library.md#the-taxonomy-app).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxonomy
  cancel-in-progress: false

env:
  BRANCH: taxonomy-deck

# bash with pipefail, so a step whose script fails in a pipe fails too.
defaults:
  run:
    shell: bash

jobs:
  # One small request: the taxonomy's versions, against the newest the deck
  # records. A pull request already open for the newest version is left as
  # it is, so the deck is not made again every week until it is merged.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update: ${{ steps.open.outputs.update }}
      newest: ${{ steps.check.outputs.newest }}
      next: ${{ steps.check.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - id: check
        run: python3 scripts/taxonomy_deck.py --check | tee -a "$GITHUB_OUTPUT"
      - id: open
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE: ${{ steps.check.outputs.update }}
          NEWEST: ${{ steps.check.outputs.newest }}
        run: |
          title="$(gh pr list --head "$BRANCH" --state open --json title --jq '.[0].title // ""')"
          if [ "$UPDATE" = true ] && [[ "$title" == *"taxonomy version $NEWEST "* ]]; then
            echo "::notice::The pull request for taxonomy version $NEWEST is open already: merge it, or close it to have it made again."
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=$UPDATE" >> "$GITHUB_OUTPUT"
          fi

  # Makes the deck's next version and checks it, with no secret and a
  # token that can only read: everything installed runs here (npm's and
  # PyPI's packages, the scripts), so none of it runs where the taxonomy
  # app's key is. The files it made go to the publish job as an artifact
  # of this run.
  update:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEWEST: ${{ needs.check.outputs.newest }}
      NEXT: ${{ needs.check.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # A published taxonomy version never changes, so its snapshot is kept;
      # the script still checks each against the checksum the deck records.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/taxonomy
          key: taxonomy-${{ needs.check.outputs.newest }}
          restore-keys: taxonomy-
      # The deck's newest version first: its cards must come out the same
      # from the taxonomy versions it records, or the script, the Python it
      # runs on or a published taxonomy version has changed, and the next
      # version would say what it should not.
      - run: python3 scripts/taxonomy_deck.py --verify --cache-dir ~/.cache/taxonomy
      - run: >-
          python3 scripts/taxonomy_deck.py --to "$NEWEST" --cache-dir ~/.cache/taxonomy
          --notes-file "$RUNNER_TEMP/notes.txt"

      # The checks of CI's library and crosscheck jobs; the pull request
      # then runs all of CI.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:turtle
      - run: npm run library
      - run: npm run library:check -- --base HEAD
      - run: pip install --require-hashes -r "$GITHUB_WORKSPACE/scripts/requirements-ci.txt"
        working-directory: ${{ runner.temp }}
      - run: python scripts/shacl_crosscheck.py

      # The new version and the index, the only files a new version
      # changes, with its notes. Anything else changed in decks/ stops the
      # run, rather than being left out of the pull request unseen.
      - name: The files to publish
        run: |
          version="decks/swedish-labour-market-taxonomy-occupation-names/v$NEXT.ttl"
          changed="$(git add --intent-to-add decks && git diff --name-only -- decks | sort)"
          expected="$(printf '%s\n' decks/index.ttl "$version" | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "::error::The new version changed other files in decks/ than $version and decks/index.ttl:"
            echo "$changed"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/deck/$(dirname "$version")"
          cp decks/index.ttl "$RUNNER_TEMP/deck/decks/index.ttl"
          cp "$version" "$RUNNER_TEMP/deck/$version"
          cp "$RUNNER_TEMP/notes.txt" "$RUNNER_TEMP/deck/notes.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taxonomy-deck
          path: ${{ runner.temp }}/deck/
          if-no-files-found: error
          retention-days: 1

  # Opens the issue, pushes the new version and opens the pull request
  # with the taxonomy app's token. The app's key is a secret of this job's
  # environment, and GitHub hands a job its secrets when it starts, so
  # the job installs and runs nothing but git, gh and the runner's own
  # tools: no package, no script of the repository
  # (docs/deck-library.md#the-taxonomy-app). It takes the update job's
  # files from this run alone, and only the files a new version changes.
  publish:
    needs: [check, update]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The taxonomy app's key lives here, and the environment admits only
    # main (docs/deck-library.md#the-taxonomy-app).
    environment: labour-market-deck
    permissions:
      contents: read
    env:
      NEWEST: ${{ needs.check.outputs.newest }}
      NEXT: ${{ needs.check.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No run-id: the artifact of this run, which only the update job
      # uploads.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: taxonomy-deck
          path: ${{ runner.temp }}/deck
      # The artifact holds the new version, the index and the notes, as
      # plain files, and nothing else; the version is new and the index
      # is there already. Only those two files are staged.
      - name: The artifact holds only the new version
        run: |
          if ! [[ "$NEWEST" =~ ^[0-9]+$ && "$NEXT" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected taxonomy or deck version: $NEWEST, $NEXT."
            exit 1
          fi
          version="decks/swedish-labour-market-taxonomy-occupation-names/v$NEXT.ttl"
          found="$(cd "$RUNNER_TEMP/deck" && find . -mindepth 1 ! -type d | sort)"
          expected="$(printf './%s\n' decks/index.ttl "$version" notes.txt | sort)"
          if [ "$found" != "$expected" ]; then
            echo "::error::The artifact holds other files than $version, decks/index.ttl and notes.txt:"
            echo "$found"
            exit 1
          fi
          for file in decks/index.ttl "$version" notes.txt; do
            if [ -L "$RUNNER_TEMP/deck/$file" ] || ! [ -f "$RUNNER_TEMP/deck/$file" ]; then
              echo "::error::$file in the artifact is not a plain file."
              exit 1
            fi
          done
          # The notes go into the commit and the pull request: one line, as
          # the script writes it, with nothing GitHub or semantic-release
          # would act on (an issue reference, an address, a mention, a
          # breaking change).
          notes="$RUNNER_TEMP/deck/notes.txt"
          if [ "$(wc -c < "$notes")" -gt 65536 ] || [ "$(grep -c '' "$notes")" != 1 ] \
            || ! grep -qE "^(Adds taxonomy|Makes the deck's version) " "$notes" \
            || grep -qiE '#[0-9]|://|@|breaking' "$notes"; then
            echo "::error::The artifact's notes.txt is not the version notes the script writes."
            exit 1
          fi
          if [ -e "$version" ] || ! [ -f decks/index.ttl ] || [ -L decks/index.ttl ]; then
            echo "::error::$version exists already, or decks/index.ttl does not."
            exit 1
          fi
          cp "$RUNNER_TEMP/deck/decks/index.ttl" decks/index.ttl
          cp "$RUNNER_TEMP/deck/$version" "$version"
          git add -- decks/index.ttl "$version"
          status="$(git status --porcelain --untracked-files=all)"
          if [ "$status" != "$(printf 'M  decks/index.ttl\nA  %s' "$version")" ]; then
            echo "::error::Other files than $version and decks/index.ttl changed:"
            echo "$status"
            exit 1
          fi

      # The token lasts an hour.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LABOUR_MARKET_DECK_CLIENT_ID }}
          private-key: ${{ secrets.LABOUR_MARKET_DECK_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      # Every commit names its issue (CONTRIBUTING.md#commit-messages): the
      # taxonomy version's own, opened here if it is not open yet. The pull
      # request closes it, and those of earlier versions still open, since
      # the new version of the deck covers them too. The open issues are
      # listed, not searched: GitHub's search finds a new issue only later.
      - id: issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          title="Taxonomy version $NEWEST is out"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request | not) | select(.title | test("^Taxonomy version [0-9]+ is out$")) | "\(.number) \(.title)"' \
            > "$RUNNER_TEMP/issues.txt"
          number="$(awk -v title="$title" '{ n = $1; $1 = ""; if (substr($0, 2) == title) { print n; exit } }' "$RUNNER_TEMP/issues.txt")"
          if [ -z "$number" ]; then
            url="$(gh issue create --title "$title" --label deck --body "Arbetsförmedlingen has published version $NEWEST of its labor market taxonomy. The [taxonomy workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) makes version $NEXT of the deck of new and changed occupation names from it, in a pull request that closes this issue (docs/deck-library.md#the-taxonomy-deck).")"
            number="${url##*/}"
          fi
          {
            echo "closes<<EOF"
            { echo "$number"; cut -d ' ' -f 1 "$RUNNER_TEMP/issues.txt"; } | sort -nu | sed 's/^/Closes: #/'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          CLOSES: ${{ steps.issue.outputs.closes }}
        run: |
          id="$(gh api "/users/$APP%5Bbot%5D" --jq .id)"
          export GIT_AUTHOR_NAME="${APP}[bot]" GIT_AUTHOR_EMAIL="${id}+${APP}[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          title="feat(decks): add taxonomy version $NEWEST to the occupation names deck"
          why="Arbetsförmedlingen has published version $NEWEST of its labor market taxonomy. This is version $NEXT of the deck of new and changed occupation names, made from it by the weekly taxonomy workflow, as the deck promises one version per taxonomy version (docs/deck-library.md#the-taxonomy-deck)."
          git switch -c "$BRANCH"
          # The body wrapped at 72 columns (docs/style.md#commits); the pull
          # request's, Markdown, is not.
          git commit -m "$title" -m "$(fold -s -w 72 <<< "$why" | sed 's/ *$//')" \
            -m "$(fold -s -w 72 "$RUNNER_TEMP/deck/notes.txt" | sed 's/ *$//')" -m "$CLOSES"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          body="$(cat <<EOF
          ## What and why

          $why

          $(cat "$RUNNER_TEMP/deck/notes.txt")

          Made by [the taxonomy workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), which first made the cards of the deck's newest version again from the taxonomy and found them unchanged, then checked the new version as CI's library and crosscheck jobs do. Merging it publishes the version.

          $CLOSES
          EOF
          )"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --head "$BRANCH" --title "$title" --body "$body" --label deck
          else
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          fi

  failed:
    needs: [check, update, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="The weekly taxonomy deck update failed"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // ""')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "It failed again: $run"
          else
            gh issue create --title "$title" --body "See $run. The script stops when the deck's newest version does not come out the same from the taxonomy, when a published taxonomy version has changed, or when the taxonomy is not as it expects; the checks stop when the new version would not be valid (docs/deck-library.md#the-taxonomy-deck)."
          fi
