name: Deploy to GitHub Pages

# The site, the newest released version only (docs/deployment.md): when
# CI has passed on a push to main, the commit it checked, if a version
# tag (vX.Y.Z, which release.yml pushes with the release commit) names
# it, as the site CI built and tested, given the version's number; or,
# run by hand from main, the newest version, built here after npm run
# check. Either way, only if the tag is the newest version on main, names
# that version's release commit, and has its GitHub release. Other
# commits on main are not deployed, and neither is an older version: the
# site always runs the newest version the releases page lists, and its
# docs are that version's only.
# CI also runs on pull requests, a fork's included, and a fork's branch
# may be named main too: workflow_run's branch filter matches that name,
# so the job checks that CI ran for a push, in this repository.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] the jobs act only on CI's push runs on main, in this repository
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# What every job may read. Only the jobs that publish to GitHub Pages
# may write to it, each saying so: a job's permissions replace these.
permissions:
  contents: read
  # To download the user journeys' report from the CI run.
  actions: read

# A deploy waiting its turn is replaced by a newer one in its group. Only
# a run that may deploy (one by hand, or one after CI on a release
# commit) shares the group pages, so a newer run that deploys nothing
# cannot replace a release's; any other run has a group of its own. A
# re-run after CI on an older release commit shares it too, as nothing
# tells it apart before it runs: it deploys nothing, so if it replaced
# a newer release's deploy waiting its turn, run the deploy by hand.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
    (github.event.workflow_run.event == 'push' &&
    github.event.workflow_run.head_repository.full_name == github.repository &&
    startsWith(github.event.workflow_run.head_commit.message, 'chore(release): ')))
    && 'pages' || format('pages-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # The commit to deploy: a released version's, or none.
  version:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # release.yml pushes the tag just after the release commit, and CI on
      # that commit takes minutes, so the tag is there by now; for a release
      # commit, the fetch is tried a few times in case it is not yet. Only
      # a plain version tag (vX.Y.Z) counts, and by hand only one on main.
      - name: A version tag names the commit
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE: "${{ startsWith(github.event.workflow_run.head_commit.message, 'chore(release): ') }}"
        run: |
          for _ in 1 2 3 4 5 6; do
            git fetch --force --tags --quiet origin
            if [ "$EVENT" = workflow_dispatch ]; then
              tag=$(git tag --merged HEAD --list 'v[0-9]*' --sort=-v:refname |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
            else
              tag=$(git tag --points-at "$SHA" --list 'v[0-9]*' |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
            fi
            [ -n "$tag" ] && break
            [ "$EVENT" = workflow_dispatch ] && break
            [ "$RELEASE" = true ] || break
            sleep 20
          done
          if [ -z "$tag" ]; then
            echo "::notice::No version tag names this commit, so the site is not deployed (docs/deployment.md)."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # The tag alone does not make a release: it must be the newest
      # version on main, so a re-run of CI or of this workflow on an older
      # release commit cannot put that version back; its commit must be
      # the release commit of that version, so a tag put on another commit
      # by hand is not deployed; and its GitHub release must be made, so
      # the site never runs a version the releases page does not list.
      # semantic-release makes the release seconds after it pushes the
      # tag, so it is looked for a few times. A version that is not the
      # newest is a notice; anything else fails the run, as it should not
      # happen (docs/deployment.md).
      - name: The tag is the newest release
        id: release
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch --force --quiet origin main
          newest=$(git tag --merged FETCH_HEAD --list 'v[0-9]*' --sort=-v:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ "$TAG" != "$newest" ]; then
            echo "::notice::$TAG is not the newest version on main (${newest:-none} is), so the site is not deployed (docs/deployment.md)."
            exit 0
          fi
          sha=$(git rev-list -n 1 "$TAG")
          subject=$(git log -1 --format=%s "$sha")
          if [ "$subject" != "chore(release): ${TAG#v}" ]; then
            echo "::error::$TAG names $sha, which is not its release commit (chore(release): ${TAG#v}), so the site is not deployed (docs/releasing.md#when-a-release-fails)."
            exit 1
          fi
          for _ in 1 2 3 4 5 6; do
            draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
            [ "$draft" = false ] && break
            sleep 10
          done
          if [ "$draft" != false ]; then
            echo "::error::$TAG has no GitHub release, so the site is not deployed: make it, then deploy by hand (docs/releasing.md#when-a-release-fails)."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG."

  build:
    needs: version
    if: needs.version.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To download the site from the CI run on the release commit.
      actions: read
      # To set up GitHub Pages, before the artifact is uploaded.
      pages: write
    # A run by hand checks and builds first, with no Turbo cache: as long
    # as CI's check and site jobs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No package's install script runs (docs/vendor-code.md#installing),
      # though the release checked out may predate the root .npmrc.
      - run: npm ci --ignore-scripts
      # After CI on the release commit, the site that run carries (its site
      # artifact): the build of the tree the merge queue tested, and the
      # user journeys ran on, which its reuse job took over, or its own
      # site job's when it ran every job. That build came before the
      # release wrote its version, so the version is put in its pages, the
      # one place it is stated (npm run site:version); its scripts, and
      # the commit it names, stay as tested (docs/deployment.md). A version
      # from before (no siteVersion.ts) has no such artifact, and is built
      # here, as it was then. The artifact is unpacked outside the checkout,
      # as the journeys' report is below, so none of its files can stand in
      # for one of the checkout's that a later step runs; only once it is
      # stated does it go where the build would have written it.
      - if: github.event_name == 'workflow_run' && hashFiles('scripts/siteVersion.ts') != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/site/
      - if: github.event_name == 'workflow_run' && hashFiles('scripts/siteVersion.ts') != ''
        env:
          SITE: ${{ runner.temp }}/site
        run: |
          npm run site:version -- "$SITE"
          mv "$SITE" apps/web/dist
      # A run by hand has no CI run behind it, so it checks the version and
      # builds it. Chromium, which npm run check and npm run build draw the
      # docs' Mermaid diagrams in (docs/markdown.md); the action is the
      # checked-out version's: one from before the drawings has none, and
      # needs none.
      - if: >-
          (github.event_name == 'workflow_dispatch' || hashFiles('scripts/siteVersion.ts') == '') &&
          hashFiles('.github/actions/chromium/action.yml') != ''
        uses: ./.github/actions/chromium
      - if: github.event_name == 'workflow_dispatch'
        run: npm run check
      - if: github.event_name == 'workflow_dispatch' || hashFiles('scripts/siteVersion.ts') == ''
        run: npm run build
      # The artifact is the whole site: the app, and beside it what the
      # build writes: ns/, decks/, the vendored shapes, robots.txt, the
      # sitemap, the Client ID Document and the docs (docs/deployment.md).
      # The user journeys' report is not in it: the journeys job publishes
      # it on a site of its own.
      # robots.txt always, and the sitemap whenever CNAME names a domain
      # (docs/deployment.md#custom-domain-optional), the Client ID Document
      # too, as logins on that domain name it (docs/authentication.md); the
      # docs, with their diagrams drawn and the font's license beside them
      # (docs/markdown.md), so a build under DOCS_DIAGRAMS=skip is not
      # deployed. Each only when the checked-out version's build writes it:
      # a version from before (no siteMap.ts, no clientId.ts, no
      # publishDocs.ts, in packages/site/ or before that in vocab's and
      # markdown's tooling/) can still be deployed.
      - name: The vocabulary, the deck library, robots.txt, the sitemap, the Client ID Document and the docs are in the artifact
        run: >-
          test -f apps/web/dist/ns/vocab/v1.ttl && test -f apps/web/dist/decks/index.ttl
          && { { [ ! -f packages/site/src/siteMap.ts ] && [ ! -f packages/vocab/tooling/siteMap.ts ]; } || {
          test -f apps/web/dist/robots.txt
          && { [ ! -s CNAME ] || test -f apps/web/dist/sitemap.xml; }; }; }
          && { [ ! -f packages/site/src/clientId.ts ] || [ ! -s CNAME ] || test -f apps/web/dist/clientid.jsonld; }
          && { { [ ! -f packages/site/src/publishDocs.ts ] && [ ! -f packages/markdown/tooling/publishDocs.ts ]; } || {
          test -f apps/web/dist/docs/index.html
          && test -f apps/web/dist/docs/diagrams/OFL-Fredoka.txt
          && compgen -G 'apps/web/dist/docs/diagrams/*.svg' > /dev/null; }; }
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: [version, build]
    runs-on: ubuntu-latest
    # To deploy the artifact to GitHub Pages, which proves the run is this
    # workflow's with an OIDC token.
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Re-running only this job, or build and this job, of an older run
      # skips the version job, so the version is looked up again here: a
      # newer one released since stops the deploy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
          persist-credentials: false
      - name: The tag is still the newest version
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          newest=$(git tag --merged origin/main --list 'v[0-9]*' --sort=-v:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ "$TAG" != "$newest" ]; then
            echo "::error::$TAG is no longer the newest version on main ($newest is), so the site is not deployed (docs/deployment.md)."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The user journeys' report of the CI run deployed from, its traces
  # viewable step by step, published at journeys.solid-memo.com from the
  # repository solid-memo/journeys (docs/deployment.md#the-journeys-report):
  # a site of its own, so the report's scripts do not run on the app's
  # origin. Each release replaces that repository's main with one commit,
  # so it keeps only the newest report. A run by hand has no CI run, so no
  # report.
  journeys:
    needs: [version, deploy]
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    # To download the report from the CI run.
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    # Its secret is the journeys repository's deploy key, with write
    # access; the environment admits only main.
    environment:
      name: journeys
      url: https://journeys.solid-memo.com/
    env:
      JOURNEYS_REPO: solid-memo/journeys
      JOURNEYS_HOST: journeys.solid-memo.com
    steps:
      # A copy without the key, such as a fork, publishes no report, and
      # says so.
      - name: The deploy key is set
        id: key
        env:
          KEY: ${{ secrets.JOURNEYS_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::No JOURNEYS_DEPLOY_KEY secret (in the journeys environment), so the journeys' report is not published (docs/deployment.md#the-journeys-report)."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      # As in the deploy job: re-running this job alone of an older run
      # must not put an older version's report back.
      - if: steps.key.outputs.set == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          # .github for the tags, and what stands in for the trace viewer.
          sparse-checkout: |
            .github
            e2e/journeys/report
          persist-credentials: false
      - name: The tag is still the newest version
        if: steps.key.outputs.set == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          newest=$(git tag --merged origin/main --list 'v[0-9]*' --sort=-v:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ "$TAG" != "$newest" ]; then
            echo "::error::$TAG is no longer the newest version on main ($newest is), so its journeys' report is not published (docs/deployment.md)."
            exit 1
          fi
      - if: steps.key.outputs.set == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: journeys-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/journeys
      # The report, with the files Pages needs beside it: CNAME, which
      # keeps the custom domain, .nojekyll, so Pages serves the files as
      # they are, and robots.txt, which keeps search engines out. Its
      # trace viewer is left out: the viewer opens a trace from any
      # address, so e2e/journeys/report/trace/ stands in for it, sending
      # the report's own traces on to trace.playwright.dev
      # (docs/deployment.md#the-journeys-report). One
      # commit with no parent, force-pushed over main. The key is written
      # to a file for this step alone, which git's ssh reads, as in
      # release.yml; GitHub's host keys come from its API.
      - name: Publish the report to the journeys repository
        if: steps.key.outputs.set == 'true'
        env:
          KEY: ${{ secrets.JOURNEYS_DEPLOY_KEY }}
          TAG: ${{ needs.version.outputs.tag }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ssh="$(mktemp -d "$RUNNER_TEMP/journeys-ssh.XXXXXX")"
          trap 'rm -rf "$ssh"' EXIT
          (umask 077 && printf '%s\n' "$KEY" > "$ssh/key")
          unset KEY
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh/known_hosts -o StrictHostKeyChecking=yes"
          cd "$RUNNER_TEMP/journeys"
          test -f index.html
          rm -rf trace
          cp -R "$GITHUB_WORKSPACE/e2e/journeys/report/trace" trace
          echo "$JOURNEYS_HOST" > CNAME
          touch .nojekyll
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          git init --quiet -b main
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet \
            -m "chore: publish the journeys report of $TAG" \
            -m "The user journeys' report of the CI run on $TAG in $GITHUB_REPOSITORY ($RUN_URL). Each release replaces main with one commit, so this repository keeps only the newest report."
          git push --force "git@github.com:$JOURNEYS_REPO.git" main
          echo "Published the journeys' report of $TAG at https://$JOURNEYS_HOST/."
