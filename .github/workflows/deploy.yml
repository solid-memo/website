name: Deploy to GitHub Pages

# The site, from main only (docs/deployment.md): when CI has passed on a
# push to main, the commit it checked; or, run by hand from main, main
# as it is, after npm run check. CI also runs on pull requests, a fork's
# included, and a fork's branch may be named main too: workflow_run's
# branch filter matches that name, so the job checks that CI ran for a
# push, in this repository.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # To download the user journeys' report from the CI run.
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # A run by hand checks first, with no Turbo cache: as long as CI's build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # CI checked the commit a workflow_run deploys; a run by hand has no
      # CI run behind it, so it checks main itself.
      - if: github.event_name == 'workflow_dispatch'
        run: npm run check
      - run: npm run build
      # The artifact is the whole site: the app, and beside it what Vite
      # copies from ns/, decks/ and the vendored shapes (docs/deployment.md).
      # The user journeys' report of the CI run deployed from, its traces
      # viewable step by step, at /journeys/ (docs/deployment.md). A run by
      # hand has no CI run, so no report.
      - if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: journeys-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: apps/web/dist/journeys
      - name: The vocabulary and the deck library are in the artifact
        run: test -f apps/web/dist/ns/vocab/v1.ttl && test -f apps/web/dist/decks/index.ttl
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
