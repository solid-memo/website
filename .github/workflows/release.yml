name: Release

# A version, from main only (docs/releasing.md): when CI has passed on a
# push to main, semantic-release (release.config.mjs) reads the commits
# since the last tag and, when one is releasable (feat:, fix:, perf: or a
# breaking change), commits the new version to main, tags it and makes a
# GitHub release of it. Run by hand from main, it releases main's tip
# once CI has passed on it, as after a release that failed. A fork's
# branch may be named main too, so the jobs check, as deploy.yml does,
# that CI ran for a push, in this repository.
#
# While the merge queue for main holds entries, a push run releases
# nothing: a release commit moves main under the queue, and GitHub builds
# every entry again on top of it. The push run of the last entry to
# merge finds the queue empty and releases every commit since the last
# tag as one version. When that entry fails or leaves the queue, no push
# follows it, and main's commits wait for the next merge or a run by
# hand, which releases main's tip whatever the queue holds
# (docs/releasing.md#what-a-release-does).
#
# The release commit is pushed with a deploy key (the SEMANTIC_RELEASE_KEY
# secret), which the ruleset on main lets bypass its pull request: the
# run's own token could not, and a push made with it would start no
# workflow. A push with the key does, so CI runs on the release commit,
# the deploy after it puts the new version on the site (deploy.yml deploys
# only a commit a version tag names). This workflow skips that run:
# nothing has been committed since the release commit's own tag, so the
# prepare job there would install everything and draw the
# diagrams only for semantic-release to find nothing. The key is a secret
# of the release environment, which allows only main, so a workflow
# pushed on any other branch cannot read it, as it could a repository
# secret.
#
# Only the push job holds the key, and it installs nothing and loads no
# package (docs/releasing.md#the-deploy-key). semantic-release runs in
# the prepare job, with no key and a token that can only read, and
# commits and tags the release in a copy of the checkout; the push job
# checks that the commit holds nothing but a release's changes, and
# pushes it and its tag at once; the publish job makes the GitHub
# release, with no key. The release carries the version's docs, rendered
# in the prepare job (npm run docs:archive) and attested as this
# workflow's on main, so whoever downloads them can check where they
# came from. Their diagrams are drawn in Chromium in the prepare job. When
# the release could not be made, or its archive not attached or
# attested, run this by hand with the version's tag, and the docs jobs
# make the release if it is missing, render the archive in a job that
# can only read, attest and attach it in one that loads no package, and
# publish the release if it is a draft, without the key
# (docs/releasing.md#when-a-release-fails).

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] only the queue, prepare, push and publish jobs run on it, for CI's push runs on main in this repository
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Leave empty to release main's tip. A version's tag (vX.Y.Z) instead
          attaches that version's docs to its GitHub release and publishes it.
        required: false
        default: ""

# Each job asks for what it needs.
permissions: {}

# No job may read or write GitHub's cache: the release restores nothing
# from it, and the docs-render job runs a tag's packages, which in a run
# on main could otherwise write main's cache entries for another job to
# restore (docs/releasing.md#the-deploy-key).
cache-mode: none

# One release at a time, and a running one never canceled: a run
# canceled between its push and publish jobs leaves a tag without its
# GitHub release. The group is the workflow's, so no run's prepare job
# can start between another's prepare and push jobs. GitHub keeps one
# pending run in a group, so a run queued behind it replaces one already
# waiting; whichever runs releases main's tip once CI has passed on it.
# A run that cannot release (for CI's failures, pull requests and the
# release commit's own run) has a group of its own, so it never replaces
# a waiting release; a run of the docs jobs has one for its tag.
concurrency:
  group: >-
    ${{
      (github.event_name == 'workflow_dispatch' && inputs.tag != '' &&
       format('release-docs-{0}', inputs.tag)) ||
      ((github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         !startsWith(github.event.workflow_run.head_commit.message, 'chore(release): '))) &&
       'release') ||
      format('release-none-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  # How many entries the merge queue for main holds, for the prepare job,
  # which a push run releases with only when it holds none. It runs for
  # the push runs the prepare job runs for, and holds no secret, no
  # environment and a token that can only read: it checks out nothing
  # and runs none of the repository's code. It asks GitHub's GraphQL API
  # with the job's token, which reads a public repository's merge queue
  # with contents: read. A query that fails fails the job, and so
  # the run, rather than release or hold in silence: the next merge's
  # run asks again, and a run by hand releases. A branch with no merge
  # queue, as a fork's main may be, holds none.
  queue:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release): ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      entries: ${{ steps.queue.outputs.entries }}
    steps:
      - name: The merge queue's entries
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QUERY: >-
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                mergeQueue(branch: "main") { entries { totalCount } }
              }
            }
        run: |
          set -eo pipefail
          entries="$(gh api graphql -f query="$QUERY" \
            -f owner="${GH_REPO%%/*}" -f name="${GH_REPO#*/}" \
            --jq '.data.repository.mergeQueue.entries.totalCount // 0')"
          if ! [[ "$entries" =~ ^[0-9]+$ ]]; then
            echo "::error::GitHub's API gave no count of the merge queue's entries: $entries"
            exit 1
          fi
          if [ "$entries" != 0 ]; then
            echo "::notice::The merge queue for main holds $entries entries, so nothing is released: the push run of the last to merge releases this commit with theirs (docs/releasing.md#what-a-release-does)."
          fi
          echo "entries=$entries" >> "$GITHUB_OUTPUT"

  # semantic-release, with no key and a token that can only read
  # (docs/releasing.md#the-deploy-key). After the queue job, which a run
  # by hand skips: !cancelled() lets it run when the job it needs was
  # skipped, and a push run releases only once the queue job has found
  # the queue empty. It draws the docs' diagrams in Chromium first, and
  # semantic-release commits and tags the release in a
  # bare copy of the checkout, which git's url.<copy>.insteadOf puts in
  # place of GitHub's URL: the notes link to GitHub, and nothing leaves
  # the runner. The commit and its tag are kept as a git bundle, and the
  # docs' archive beside it, for the push and publish jobs.
  prepare:
    needs: queue
    if: >-
      !cancelled() && (
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       inputs.tag == '') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(release): ') &&
       needs.queue.result == 'success' && needs.queue.outputs.entries == '0'))
    runs-on: ubuntu-latest
    # Room for Ubuntu's mirror to stall (actions/playwright-deps gives each
    # apt-get four tries of three minutes).
    timeout-minutes: 40
    permissions:
      contents: read
      # To look up CI's runs on main's tip.
      actions: read
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    steps:
      # main's tip, not the commit CI checked: semantic-release releases
      # the branch. The whole history and every tag, to find the last
      # release and the commits since. Keeping no credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # Nothing in the release's jobs comes from GitHub's cache
      # (docs/releasing.md#the-deploy-key): any job on main can write
      # main's entries, and what this job makes is pushed with the key.
      # npm's cache neither, which setup-node would restore for
      # packageManager in package.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Only a tip that CI passed on is released. When main has moved on
      # since the commit CI checked, the tip is released if CI has passed
      # on it too: a newer run may have been replaced while it waited for
      # the group, as GitHub keeps one pending run per group. If CI has
      # not passed on the tip yet, its own run releases it.
      #
      # A release commit with no tag (pushed by hand without it) stops
      # every run: semantic-release, finding no tag, would release the
      # same version again on top of it. Only a commit semantic-release
      # made counts (npm run release:commit, scripts/releaseCommit.ts): on
      # main's first-parent chain, by github-actions[bot], changing only
      # the files a release writes; a pull request's commit titled as one
      # does not.
      - name: CI passed on main's tip
        id: tip
        env:
          EVENT: ${{ github.event_name }}
          CHECKED: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          npm run release:commit -- last
          tip="$(git rev-parse HEAD)"
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_run ] && [ "$tip" = "$CHECKED" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$(gh run list --workflow ci.yml --commit "$tip" --event push --status success --limit 1 --json databaseId --jq '.[].databaseId')" ]; then
            if [ "$EVENT" = workflow_run ]; then
              echo "::notice::main has moved on from $CHECKED to $tip, and CI has not passed on $tip yet: its run releases it."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::CI has not passed on a push of main's tip, $tip: run this again once it has."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
      # No package's install script runs here: the release needs none,
      # and Chromium comes from the Chromium action, below.
      - if: steps.tip.outputs.release == 'true'
        run: npm ci --ignore-scripts
      # Every installed version is signed by the registry, and its
      # attestations verify, as in CI's check job, before Chromium is
      # downloaded and semantic-release runs
      # (docs/releasing.md#the-deploy-key).
      - if: steps.tip.outputs.release == 'true'
        run: npm audit signatures
      # Chromium, downloaded and checked against a committed SHA-256, with
      # its system libraries from Ubuntu's signed mirror, not restored from
      # the cache.
      - if: steps.tip.outputs.release == 'true'
        uses: ./.github/actions/chromium
        with:
          cache: false
      # npm ci emptied the drawings' cache, so it holds this run's
      # drawings alone, each checked as the site's build checks it
      # (checkSvg, and the font's notice); the archive in the release's
      # prepare step takes them from it with --drawn, drawing nothing
      # (release.config.mjs).
      - if: steps.tip.outputs.release == 'true'
        name: Draw the docs' diagrams
        run: npm run docs:archive -- --draw
      # Commits the release and tags it in a bare copy of the checkout,
      # which stands in for GitHub's URL: semantic-release fetches from,
      # checks it can push to, and pushes to the copy. No token is in the
      # step's environment, so semantic-release puts none in the URL,
      # which would then not be the one the copy stands in for. git
      # refuses https in the checkout, so nothing reaches GitHub if it
      # did; and the checkout keeps no credentials, so a push that did
      # would be refused too (scripts/releaseConfig.test.ts runs it so).
      - if: steps.tip.outputs.release == 'true'
        name: npx semantic-release
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_TERMINAL_PROMPT: "0"
        run: |
          copy="$RUNNER_TEMP/release.git"
          git clone --quiet --bare . "$copy"
          git config "url.file://$copy.insteadOf" "$REPOSITORY_URL"
          git config protocol.https.allow never
          npx semantic-release --repository-url "$REPOSITORY_URL"
      # What semantic-release pushed to the copy: nothing, or one commit
      # on main's tip and its tag, kept as a bundle for the push job,
      # beside the docs' archive for the publish job. The notes refs it
      # writes stay behind: a tag without them is on the default channel.
      - if: steps.tip.outputs.release == 'true'
        name: The release, as a bundle
        id: released
        env:
          TIP: ${{ steps.tip.outputs.sha }}
        run: |
          copy="$RUNNER_TEMP/release.git"
          head="$(git -C "$copy" rev-parse --verify refs/heads/main)"
          if [ "$head" = "$TIP" ]; then
            echo "Nothing to release."
            exit 0
          fi
          tag="$(git -C "$copy" tag --points-at "$head")"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::semantic-release committed $head, tagged ${tag:-nothing}, not one version's tag."
            exit 1
          fi
          mkdir "$RUNNER_TEMP/bundle"
          git -C "$copy" bundle create "$RUNNER_TEMP/bundle/release.bundle" "refs/tags/$tag" "^$TIP"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - if: steps.released.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle/release.bundle
          if-no-files-found: error
          retention-days: 7
      - if: steps.released.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-docs
          path: release-assets/docs-${{ steps.released.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The release commit and its tag, pushed to main with the deploy key,
  # which the ruleset on main lets bypass its pull request. Its secret is
  # the key: GitHub hands it to the job when the job starts, so every
  # step of the job can read it, not only the steps that name it. So the
  # job installs nothing and loads no package: git, ssh, and main's own
  # scripts, which import none (docs/releasing.md#the-deploy-key). The
  # bundle the prepare job made is pushed only once the commit is a
  # release commit on main's tip with nothing but a release's changes
  # (npm run release:commit -- next), and the commit and its tag go in
  # one atomic push, so main never holds the commit without its tag.
  push:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Each run is recorded as a deployment to it: GitHub's docs do not say
    # that its limit to main holds with deployment: false.
    environment: release
    outputs:
      pushed: ${{ steps.pushed.outputs.pushed }}
    steps:
      # A copy without the key, such as a fork, releases nothing, and says
      # so. GitHub makes the environment, with no secrets, the first time
      # a run names it.
      - name: The deploy key is set
        id: key
        env:
          KEY: ${{ secrets.SEMANTIC_RELEASE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::No SEMANTIC_RELEASE_KEY secret (in the release environment), so nothing is released (docs/releasing.md#the-deploy-key)."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      # main's tip, which the release commit must be on, with every tag.
      # Keeping no credentials: only the push, below, writes the key where
      # git reads it.
      - if: steps.key.outputs.set == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # Node, for main's scripts, which import no package.
      - if: steps.key.outputs.set == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # No run-id: the artifact of this run, which only the prepare job
      # uploads.
      - if: steps.key.outputs.set == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle
      # The tag alone, from the bundle, then the commit it names checked
      # by main's script: a release commit of its version whose parent is
      # main's tip, whose message is its subject alone, and whose five
      # files are main's with the version, the date and one changelog
      # entry written in (scripts/releaseChanges.ts). The version must
      # follow the highest release tag on main, which the checkout above
      # fetched, and the date must be the run's, give or take a day.
      - if: steps.key.outputs.set == 'true'
        name: The release commit may be pushed onto main
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          bundle="$RUNNER_TEMP/bundle/release.bundle"
          git bundle verify --quiet "$bundle"
          git fetch --no-tags --quiet "$bundle" "refs/tags/$TAG:refs/tags/$TAG"
          npm run release:commit -- next "$TAG"
      # The key is written to a file for this step alone, which git's ssh
      # reads (GIT_SSH_COMMAND), and removed when it ends; the git config
      # never holds it. GitHub's host keys come from its API, over HTTPS,
      # as actions/checkout would have set them. Not forced: a main that
      # moved on, or a tag already there, refuses the whole push.
      - if: steps.key.outputs.set == 'true'
        name: Push the release commit and its tag
        id: pushed
        env:
          KEY: ${{ secrets.SEMANTIC_RELEASE_KEY }}
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_URL: git@github.com:${{ github.repository }}.git
        run: |
          ssh="$(mktemp -d "$RUNNER_TEMP/release-ssh.XXXXXX")"
          trap 'rm -rf "$ssh"' EXIT
          (umask 077 && printf '%s\n' "$KEY" > "$ssh/key")
          unset KEY
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh/known_hosts -o StrictHostKeyChecking=yes"
          sha="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git push --atomic "$REPOSITORY_URL" "$sha:refs/heads/main" "refs/tags/$TAG:refs/tags/$TAG"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  # The GitHub release of the pushed tag, with no key and no package
  # loaded: "Solid Memo X.Y.Z", with the version's changelog entry as its
  # notes (npm run release:commit -- notes) and the docs' archive the
  # prepare job made, attested as this workflow's on main. It is made as
  # a draft, which the deploy refuses, and published only once the
  # archive is attested and attached, so no version is public without
  # its docs. Zenodo archives it once published.
  publish:
    needs: [prepare, push]
    if: needs.push.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To make the release.
      contents: write
      # To attest the docs' archive (actions/attest).
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # main's tip, which the push made the release commit, with every
      # tag. Keeping no credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # Node, for main's scripts, which import no package.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: The release's notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          npm run release:commit -- tag "$TAG"
          npm run --silent release:commit -- notes "$TAG" > "$RUNNER_TEMP/notes.md"
      # No run-id: the artifact of this run, which only the prepare job
      # uploads.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-docs
          path: release-assets
      # The archive of the version's docs, attested as made by this
      # workflow on main, so whoever downloads it can check where it came
      # from (docs/deployment.md#a-releases-docs-as-an-archive), before
      # the release that carries it is published.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/docs-*.tar.gz
      # The version is main's newest, so the release is the latest.
      - name: Make the GitHub release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" --verify-tag --draft --title "Solid Memo $version" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" "release-assets/docs-$version.tar.gz#Documentation $version (HTML)"
          gh release edit "$TAG" --draft=false --latest

  # A version's GitHub release and its docs, when the release jobs could
  # not make them (docs/releasing.md#when-a-release-fails): the publish
  # job failed after the push, the release was left a draft, or its
  # archive was not attested. Run by hand from main, with the version's
  # tag, while no release run is running or waiting. Three jobs, split
  # as the release's are, so no job that can write the repository or
  # attest loads a package: docs-release checks the tag and looks up its
  # release, docs-render renders the docs from the tag's commit with a
  # token that can only read, and docs-publish attests and attaches the
  # archive and publishes the release. None has the deploy key.
  #
  # This job checks that the tag (read as refs/tags/ only) names its
  # version's release commit on main, and makes the release as a draft
  # if it has none, with the version's changelog entry as its notes. It
  # runs main's own scripts, which import no package, and installs
  # nothing: its token can write, as a draft release is seen only by a
  # token that can. A release that already carries an attested archive
  # keeps it: an archive is rendered once.
  docs-release:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To see a draft release, and to make one.
      contents: write
      # To check the archive's attestation.
      attestations: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      draft: ${{ steps.release.outputs.draft }}
      attach: ${{ steps.release.outputs.attach }}
      latest: ${{ steps.release.outputs.latest }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: The tag is a version, and what its GitHub release holds
        id: release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a version's tag (vX.Y.Z)."
            exit 1
          fi
          version="${TAG#v}"
          # A tag with no release gets one, as a draft, once its commit is
          # checked, below.
          made=true
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            made=false
            draft=true
          fi
          # An archive it carries is kept when this workflow attested it
          # on main; one that is not is replaced.
          attach=true
          if [ "$made" = true ] && gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fqx "docs-$version.tar.gz"; then
            carried="$(mktemp -d)"
            gh release download "$TAG" --pattern "docs-$version.tar.gz" --dir "$carried"
            if gh attestation verify "$carried/docs-$version.tar.gz" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref refs/heads/main --deny-self-hosted-runners > /dev/null; then
              attach=false
              if [ "$draft" = false ]; then
                echo "::notice::The release of $TAG already carries its attested docs, and is published: nothing to do."
              fi
            else
              echo "::notice::The docs the release of $TAG carries are not attested: they are rendered again, and replace them."
            fi
          fi
          # Latest only when it is the newest version, as the publish job
          # makes it; publishing an older draft must not take that from a
          # newer release.
          newest=$(gh api --paginate "repos/$GH_REPO/tags" --jq '.[].name' |
            grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)
          {
            echo "version=$version"
            echo "made=$made"
            echo "draft=$draft"
            echo "attach=$attach"
            echo "latest=$([ "$TAG" = "$newest" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      # The tag is read as refs/tags/<tag> only, never as a bare name,
      # which a branch of the same name would win; and the commit it
      # names must be its version's release commit on main, as the
      # deploy checks (npm run release:commit, scripts/releaseCommit.ts).
      # main is this run's commit, as the job runs only from main; the
      # check is main's script, under main's Node. The docs-render job
      # checks out the tag's commit by its SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: The tag names its release commit on main
        id: commit
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --force --no-tags --quiet origin "+refs/tags/$TAG:refs/tags/$TAG"
          RELEASE_MAIN=HEAD npm run release:commit -- tag "$TAG"
          echo "sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"
      # With the notes the publish job would have given it, by main's
      # script.
      - if: steps.release.outputs.made == 'false'
        name: Make the release as a draft
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          npm run --silent release:commit -- notes "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --draft --title "Solid Memo $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  # The docs of the tag's commit, rendered as the release would have
  # rendered them, with a token that can only read and nothing to attest
  # with: this job installs the tag's packages and runs its build, so it
  # holds nothing that could write the repository or sign as this
  # workflow (docs/releasing.md#when-a-release-fails). The archive goes
  # to the docs-publish job as an artifact of this run, with its SHA-256.
  docs-render:
    needs: docs-release
    if: needs.docs-release.outputs.attach == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      # The commit docs-release checked, by its SHA. Keeping no
      # credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.docs-release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The version can archive its docs
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ ! -f scripts/docsArchive.ts ]; then
            echo "::error::$TAG came before the docs were archived, so it has none to attach."
            exit 1
          fi
      # As in the prepare job, which this renders the docs as: nothing
      # from GitHub's cache, as what this job renders is attested.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # Chromium's headless shell and its system libraries, by this step
      # on main, not by .github/actions: a local action is the
      # checkout's, the tag's, whose copy may restore them from the cache
      # or download the shell unchecked. The shell is checked against the
      # SHA-256 actions/headless-shell pins too, by the same step
      # (npm run check:shell holds the two to it), so a tag whose
      # Playwright wants another build fails here; the libraries come
      # from Ubuntu's signed mirror, in the step after it.
      - shell: bash
        env:
          CHROMIUM_HEADLESS_SHELL_VERSION: 159.0.8154.6
          CHROMIUM_HEADLESS_SHELL_REVISION: "1255"
          CHROMIUM_HEADLESS_SHELL_SHA256: 77a6442fd3c8acd3bef9e1067fc26f5ef464277d22f0e8cb58dc3e4077a3e458
        run: |
          set -eo pipefail
          if [ "$RUNNER_OS" != Linux ] || [ "$RUNNER_ARCH" != X64 ]; then
            echo "::error::The headless shell's hash is Linux x64's, not $RUNNER_OS $RUNNER_ARCH's."
            exit 1
          fi
          expected=$(node -p "const b = require(require('path').join(require.resolve('playwright-core/package.json'), '../browsers.json')).browsers.find((b) => b.name === 'chromium-headless-shell'); b.browserVersion + ' ' + b.revision")
          if [ "$expected" != "$CHROMIUM_HEADLESS_SHELL_VERSION $CHROMIUM_HEADLESS_SHELL_REVISION" ]; then
            echo "::error::playwright-core wants the headless shell $expected, and $CHROMIUM_HEADLESS_SHELL_VERSION $CHROMIUM_HEADLESS_SHELL_REVISION is pinned (npm run check:shell)."
            exit 1
          fi
          zip="$RUNNER_TEMP/chrome-headless-shell-linux64.zip"
          curl -fsSL -o "$zip" "https://cdn.playwright.dev/builds/cft/$CHROMIUM_HEADLESS_SHELL_VERSION/linux64/chrome-headless-shell-linux64.zip"
          echo "$CHROMIUM_HEADLESS_SHELL_SHA256  $zip" | sha256sum -c -
          dir="$HOME/.cache/ms-playwright/chromium_headless_shell-$CHROMIUM_HEADLESS_SHELL_REVISION"
          rm -rf "$dir"
          mkdir -p "$dir"
          unzip -q "$zip" -d "$dir"
          rm "$zip"
          touch "$dir/INSTALLATION_COMPLETE"
      - run: npx playwright install-deps chromium
      - name: npm run docs:archive
        id: archive
        env:
          VERSION: ${{ needs.docs-release.outputs.version }}
        run: |
          npm run docs:archive -- "$VERSION"
          echo "sha256=$(sha256sum "release-assets/docs-$VERSION.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-docs
          path: release-assets/docs-${{ needs.docs-release.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The archive docs-render made, attested as this workflow's on main and
  # attached to the release, which is then published if it is a draft,
  # which the deploy refuses. This job holds the token that can write and
  # attest, so it checks out nothing, installs nothing and loads no
  # package: it runs gh, and the actions that download and attest. What
  # docs-render made is not trusted here: it is attached only as one
  # regular file of the version's name, whose SHA-256 docs-render stated,
  # that gzip reads and tar lists as files under docs/ only, and nothing
  # in it is run or unpacked.
  docs-publish:
    needs: [docs-release, docs-render]
    if: >-
      !cancelled() && needs.docs-release.result == 'success' &&
      (needs.docs-release.outputs.draft == 'true' || needs.docs-release.outputs.attach == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To upload the asset and publish the release.
      contents: write
      # To attest the archive (actions/attest).
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # A draft whose archive should have been rendered, and was not,
      # stays a draft.
      - name: The archive was rendered, if the release needs it
        env:
          ATTACH: ${{ needs.docs-release.outputs.attach }}
          RENDERED: ${{ needs.docs-render.result }}
        run: |
          if [ "$ATTACH" = true ] && [ "$RENDERED" != success ]; then
            echo "::error::The docs-render job did not render the archive ($RENDERED), so the release is left as it is."
            exit 1
          fi
      # No run-id: the artifact of this run, which only docs-render
      # uploads. Outside the workspace, beside nothing else.
      - if: needs.docs-release.outputs.attach == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-docs
          path: ${{ runner.temp }}/docs
      - if: needs.docs-release.outputs.attach == 'true'
        name: The archive is the version's, as docs-render made it
        env:
          VERSION: ${{ needs.docs-release.outputs.version }}
          SHA256: ${{ needs.docs-render.outputs.sha256 }}
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/docs"
          name="docs-$VERSION.tar.gz"
          found="$(find . -mindepth 1 -print)"
          if [ "$found" != "./$name" ] || [ -L "$name" ] || [ ! -f "$name" ]; then
            printf '%s\n' "$found"
            echo "::error::The release-docs artifact holds something other than one regular file, $name (listed above), so it is not attached."
            exit 1
          fi
          if ! [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || [ "$(sha256sum "$name" | cut -d ' ' -f 1)" != "$SHA256" ]; then
            echo "::error::$name is not the archive docs-render made, by its SHA-256, so it is not attached."
            exit 1
          fi
          # Read, never unpacked: at least one entry, each a regular file
          # or a folder under docs/, by a relative path with no . or ..
          # in it, as npm run docs:archive packs them.
          gzip -t "$name"
          names="$(tar -tizf "$name")"
          types="$(tar -tvizf "$name" | cut -c 1)"
          if [ -z "$names" ] || [ "$(wc -l <<< "$names")" != "$(wc -l <<< "$types")" ] ||
            grep -qv '^[-d]$' <<< "$types" || grep -qv '^docs/' <<< "$names" ||
            grep -Eq '(^|/)\.\.?(/|$)|[\\]' <<< "$names"; then
            echo "::error::$name holds no entry, or one that is not a file or folder under docs/ by a plain relative path, so it is not attached."
            exit 1
          fi
      # Attested before it is uploaded, so the release never carries it
      # without its attestation.
      - if: needs.docs-release.outputs.attach == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/docs/docs-${{ needs.docs-release.outputs.version }}.tar.gz
      # The label release.config.mjs gives it; an archive without an
      # attestation is replaced.
      - if: needs.docs-release.outputs.attach == 'true'
        name: Attach the archive
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.docs-release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload --clobber "$TAG" "$RUNNER_TEMP/docs/docs-$VERSION.tar.gz#Documentation $VERSION (HTML)"
      - if: needs.docs-release.outputs.draft == 'true'
        name: Publish the release
        env:
          TAG: ${{ inputs.tag }}
          LATEST: ${{ needs.docs-release.outputs.latest }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest="$LATEST"
