name: Interop

# The app's use cases and Solid adapters against the advisory Solid
# servers (docs/testing.md), whose results are reported, not a gate: one
# job per server, as CI runs the blocking ones; and the user journeys in
# Chromium against the servers with Linked Web Storage. A job fails only on a test
# or journey failing that its server's expected-failures.json does not
# list (e2e/pod/servers/<id>/ for the tests, e2e/journeys/servers/<id>/
# for the journeys), or when none ran; the job's summary says what
# passed, what failed as expected and why (by its cause on
# docs/interop.md), and what passes though listed. A release commit,
# whose push its paths match (package.json, package-lock.json), runs
# nothing: it changes only the version's files, so its code is the
# commit's before it, which Interop already ran on
# (docs/releasing.md).

on:
  push:
    branches: [main]
    paths:
      - e2e/pod/**
      - e2e/journeys/**
      - apps/**
      - packages/**
      - ns/**
      - decks/**
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/interop.yml
      - .github/actions/e2e-images/**
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push's run cancels the one still going. A release commit's run,
# which runs nothing, has a group of its own, so it never cancels the run
# on the code it releases.
concurrency:
  group: >-
    interop-${{ github.ref }}${{
    startsWith(github.event.head_commit.message, 'chore(release): ') &&
    format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  pod:
    name: pod (${{ matrix.server }})
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release): ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [css-8, pivot, nextcloud, jss, css-lws, css-lws-only]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - id: key
        run: echo "key=$(node e2e/pod/servers.ts key ${{ matrix.server }})" >> "$GITHUB_OUTPUT"
      - id: images
        uses: ./.github/actions/e2e-images
        with:
          name: pod-${{ matrix.server }}
          key: ${{ steps.key.outputs.key }}
      - run: npm run servers -w @solid-memo/e2e-pod -- ${{ matrix.server }}
      - if: steps.images.outputs.hit != 'true' && github.ref == 'refs/heads/main'
        env:
          FILE: ${{ steps.images.outputs.file }}
        run: node e2e/pod/images.ts save "$FILE" e2e/pod/servers/${{ matrix.server }}/compose.yml
      - if: steps.images.outputs.hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.images.outputs.file }}
          key: ${{ steps.images.outputs.key }}
      # compare.ts says whether the run went as expected, not Vitest.
      - run: npm run test:pod
        continue-on-error: true
        env:
          SOLID_SERVERS: ${{ matrix.server }}
          E2E_RESULT_JSON: logs/result.json
      - run: node e2e/pod/compare.ts ${{ matrix.server }} e2e/pod/logs/result.json
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pod-logs-${{ matrix.server }}
          path: e2e/pod/logs/
          retention-days: 7

  # The user journeys in Chromium (docs/testing.md#user-journeys) against
  # each server with Linked Web Storage, behind TLS as its signed-in
  # instance, which the app signs in to with solid-memo-client: Inrupt's
  # client gives no ID token to exchange for a storage's (docs/lws.md).
  # The images come from the pod job's cache entries, which this job
  # only restores. compare.ts fails the job on a journey failing that the
  # server's e2e/journeys/servers/<id>/expected-failures.json does not
  # list. Timing-dependent: end to end, on a shared runner.
  journeys:
    name: journeys (${{ matrix.server }})
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release): ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        server: [css-lws, css-lws-only]
    env:
      JOURNEY_SERVER: ${{ matrix.server }}
      SOLID_CLIENT: solid-memo-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - id: key
        run: echo "key=$(node e2e/pod/servers.ts key ${{ matrix.server }})" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/e2e-images
        with:
          name: pod-${{ matrix.server }}
          key: ${{ steps.key.outputs.key }}
      - run: npm run css:prepare -w @solid-memo/e2e-journeys
      # The app alone, without the docs' diagrams, which need Chromium
      # and have nothing of the client.
      - run: npx turbo run build --filter=@solid-memo/web
        env:
          DOCS_DIAGRAMS: skip
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - uses: ./.github/actions/playwright-deps
        with:
          browser: chromium
      # compare.ts says whether the run went as expected, not Playwright.
      - id: journeys
        run: npm run journeys -- --project=chromium
        continue-on-error: true
      - if: always()
        run: node e2e/journeys/harness/summary.ts journeys-${{ matrix.server }}-${{ github.run_attempt }}
      - run: node e2e/journeys/harness/compare.ts ${{ matrix.server }}
      # Every failed journey's trace, expected or not.
      - if: failure() || steps.journeys.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journeys-${{ matrix.server }}-${{ github.run_attempt }}
          path: |
            e2e/journeys/playwright-report/
            e2e/journeys/test-results/
            e2e/journeys/logs/
          retention-days: 7
