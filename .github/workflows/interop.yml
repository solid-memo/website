name: Interop

# The app's use cases and Solid adapters against the advisory Solid
# servers (docs/testing.md), whose results are reported, not a gate: one
# job per server, as CI runs the blocking ones. A job fails only on a test
# failing that its servers/<id>/expected-failures.json does not list, or
# when no test ran; the job's summary says what passed, what failed as
# expected and why, and what passes though listed.

on:
  push:
    branches: [main]
    paths:
      - e2e/pod/**
      - packages/**
      - ns/**
      - decks/**
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/interop.yml
      - .github/actions/e2e-images/**
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pod:
    name: pod (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [css-8, pivot, nextcloud, jss]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: key
        run: echo "key=$(node e2e/pod/servers.ts key ${{ matrix.server }})" >> "$GITHUB_OUTPUT"
      - id: images
        uses: ./.github/actions/e2e-images
        with:
          name: pod-${{ matrix.server }}
          key: ${{ steps.key.outputs.key }}
      - run: npm run servers -w @solid-memo/e2e-pod -- ${{ matrix.server }}
      - if: steps.images.outputs.hit != 'true' && github.ref == 'refs/heads/main'
        run: node e2e/pod/images.ts save "${{ steps.images.outputs.file }}" e2e/pod/servers/${{ matrix.server }}/compose.yml
      - if: steps.images.outputs.hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.images.outputs.file }}
          key: ${{ steps.images.outputs.key }}
      # compare.ts says whether the run went as expected, not Vitest.
      - run: npm run test:pod
        continue-on-error: true
        env:
          SOLID_SERVERS: ${{ matrix.server }}
          E2E_RESULT_JSON: logs/result.json
      - run: node e2e/pod/compare.ts ${{ matrix.server }} e2e/pod/logs/result.json
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pod-logs-${{ matrix.server }}
          path: e2e/pod/logs/
          retention-days: 7
