name: CI

# Every change is checked before it is merged (docs/testing.md#continuous-integration):
# a pull request, from this repository or a fork, runs every job here,
# and a push to main every job or none but those that reuse the run that
# tested its tree, as the gate decides (below). A pull request is merged
# through the merge queue (merge_group), which runs them again on the
# pull request on top of main and of those ahead of it in the queue, and
# merges exactly the commit that passed. A branch's pushes alone run
# nothing, so a pull request's commits are not checked twice for one
# push. The jobs read the repository and nothing else: the token can
# only read, and no secret is used, so a fork's pull request runs them as
# safely as ours. The one exception, caches, runs on main alone and runs
# no code of the repository's. Only runs on main save Turbo's cache and
# the end-to-end images, Turbo's being the queue's when main's run reuses
# it; a pull request and the merge queue read main's.
#
# A tree is tested once (docs/releasing.md#what-each-stage-checks): the
# gate job has every job run in a pull request, in the merge queue, by
# hand, and on a push to main that skipped the queue, but on a push the
# queue passed, or a release commit, whose tree the queue (or its
# parent's full run) already tested, the run reuses that one: the jobs
# that test are skipped, and reuse takes over the site and Turbo's cache
# it made. A job that runs blocks. Each job is labeled deterministic, the
# same answer on any runner, or timing-dependent, its answer hanging on
# how busy the runner or a real server is
# (docs/testing.md#deterministic-and-timing-dependent-jobs).

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      trace:
        description: Keep the user journeys' traces, videos and screenshots even when they pass
        type: boolean
        default: false

permissions:
  contents: read

# A newer run of a pull request's or a branch's checks cancels the one
# still going. Runs on main are never canceled: release.yml releases, and
# deploy.yml deploys a release commit, only after a push run on main that
# passed, so a push run canceled by a later run, a manual one included,
# would leave its commit unreleased, or its version undeployed. Each event
# has its own group, so a run by hand never waits for a push run, and push
# runs on main go one at a time, in order; one waiting is replaced by a
# newer push, which a release then includes. A release commit's run has a
# group of its own: only that run can deploy its version, so no newer push
# may replace it.
concurrency:
  group: >-
    ci-${{ github.event_name }}-${{ github.ref }}${{
    startsWith(github.event.head_commit.message, 'chore(release): ') &&
    format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # What this run runs (npm run ci:gate): every job (jobs=all), or only
  # those that reuse the run that tested this tree (jobs=reuse), that run
  # being tested-by. On a release commit, it also
  # fails unless the commit changes nothing but the files a release
  # writes. Only on a push to main does it ask GitHub's API: whether the
  # merge queue passed the commit, or CI on main a release commit's
  # parent. Deterministic.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To look up CI's runs on the commit and on its parent.
      actions: read
    outputs:
      jobs: ${{ steps.gate.outputs.jobs }}
      tested-by: ${{ steps.gate.outputs.tested-by }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The script imports no package, so nothing is installed.
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run ci:gate

  # npm run check:ci. Deterministic. Its growth tests time CPU work, but as
  # the ratio of two runs on the same runner, which a busy runner leaves
  # about the same (packages/domain/src/testing/growth.ts).
  check:
    needs: gate
    if: needs.gate.outputs.jobs == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Turbo's cache, so a task whose inputs have not changed is not run
      # again. The key is this job's alone: a key is saved once, by the
      # first job to finish, and another job's cache would not hold the
      # check's results. Each run restores the last one and adds to it, so
      # entries older than two weeks are evicted (TURBO_CACHE_MAX_AGE).
      # Only a run on main saves it, below: a pull request's or the merge
      # queue's copy would be kept apart, under its own ref, and never
      # read again, while it would count toward the repository's 10 GB.
      - id: turbo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}
          restore-keys: turbo-check-
      - run: npm ci
      # Chromium, which site's tests draw the docs' Mermaid diagrams in
      # (docs/markdown.md).
      - uses: ./.github/actions/chromium
      # Biome's formatting and lint rules (docs/style.md), markdownlint's
      # and cspell's (docs/testing.md#documentation); then every
      # package: typecheck, tests at 100% coverage, generated code and
      # Turtle formatting in step with their sources; then the
      # boundaries, the docs' index (docs/docs.ttl) and the shipped
      # dependencies' maturity (docs/testing.md). npm run check without
      # the deck library, which the library job checks, and compares with
      # the base.
      - run: npm run check:ci
        env:
          TURBO_CACHE_MAX_AGE: 14d
      # Each package's coverage, in the run's summary; the thresholds that
      # gate are each package's own, in npm run check.
      - if: success() || failure()
        run: npm run coverage:summary
      - if: github.ref == 'refs/heads/main' && steps.turbo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}
      # In the queue, the cache is kept as the run's turbo-cache artifact
      # instead: main's run of the same commit reuses this run (gate's
      # tested-by), and saves it as main's (the reuse job). Its entries are
      # compressed already.
      - if: github.event_name == 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-cache
          path: .turbo/cache/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # Main's older Turbo caches, deleted once check or reuse has saved its
  # own, which was built on them, and they would count toward the
  # repository's 10 GB until GitHub's 7 days are up; with them, the
  # older entries of three other caches that only grow. A job of its own, so
  # the only token that can delete caches is in a job that runs none of
  # the repository's code; and one that may fail without failing the run,
  # which release.yml and deploy.yml wait for. Deterministic.
  caches:
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() &&
      (needs.check.result == 'success' || needs.reuse.result == 'success')
    needs: [check, reuse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      # shell: bash runs with pipefail, which the default does not, so a list
      # that fails fails the step instead of deleting nothing.
      - name: Keep only the newest Turbo cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref refs/heads/main --key turbo-check- --sort created_at --order desc --limit 100 \
            --json id --jq '.[1:][].id' | xargs -r -n1 gh cache delete
      # GitHub's CodeQL scan saves a database of the code for each run on
      # main, a few hundred MB, and reads only the newest of its
      # language's: the key's seventh part.
      - name: Keep only the newest CodeQL database of each language
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref refs/heads/main --key codeql-overlay-base-database- --limit 1000 \
            --json id,key,createdAt \
            --jq 'group_by(.key | split("-")[6]) | .[] | sort_by(.createdAt) | reverse | .[1:][].id' |
            xargs -r -n1 gh cache delete
      # The end-to-end images' (.github/actions/e2e-images): an entry per
      # server and key, the key's last part what names its images, so a
      # changed image leaves the older entry, which main never reads again.
      # A revert to an older key, still cached, leaves its entry the older,
      # and so deleted, until a run of main misses it and saves it again.
      - name: Keep only the newest images of each end-to-end server
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref refs/heads/main --key e2e-images- --limit 1000 \
            --json id,key,createdAt \
            --jq 'group_by(.key | split("-") | .[:-1]) | .[] | sort_by(.createdAt) | reverse | .[1:][].id' |
            xargs -r -n1 gh cache delete
      # The system libraries' (.github/actions/playwright-deps): an entry
      # per runner image, the two newest kept, as both run while GitHub
      # rolls a new image out.
      - name: Keep only the newest system libraries of each browser
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for browser in chromium firefox webkit; do
            gh cache list --ref refs/heads/main --key "playwright-deps-$browser-" --sort created_at --order desc --limit 100 \
              --json id --jq '.[2:][].id'
          done | xargs -r -n1 gh cache delete

  # The site, built once for the whole run (npm run build): the journeys
  # test this build, which they download, rather than each building its
  # own. It reads no Turbo cache: the build states the commit, so it is
  # never found there, and vocab's generate:check, the one task it runs
  # first, is check's to cache. Chromium's headless shell draws the docs'
  # diagrams. The build is kept a week, as the journeys' blobs are, so
  # that a journeys job run again (Re-run failed jobs), which does not
  # build it again, still finds it; a job run again replaces it.
  # Deterministic.
  site:
    needs: gate
    if: needs.gate.outputs.jobs == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/chromium
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/web/dist/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # The change compared with its base. The deck library
  # (docs/deck-library.md#checks): no published version
  # (decks/<name>/v<N>.ttl) edited or removed, and every version new
  # since then naming the library's contact and no email. The public
  # API (docs/releasing.md#how-ci-holds-to-it): no line of api/ gone
  # unless a commit says the change breaks, and none of api/frozen/ at
  # all. It needs the whole history, which check does not, so it is a
  # job of its own. Deterministic.
  library:
    needs: gate
    if: needs.gate.outputs.jobs == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # On a push to the default branch, compare with the commit the push
      # moved it from; in the merge queue, with the commit of the
      # default branch the queue built on, so the pull requests ahead
      # are part of the change; on a pull request (its merge with the
      # default branch) or a run by hand, with where it left the default
      # branch, so a version not merged yet can still be fixed there. A
      # push that created the default branch (all zeros), or one whose
      # earlier commit a force push left unfetched, compares with the
      # default branch.
      - name: Find the base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            base="$QUEUE_BASE"
          elif [ "$EVENT" = push ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi
          echo "Comparing with $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: npm run library:check -- --base <base>
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: npm run library:check -- --base "$BASE"
      # After the library's check, whatever it found: the two are apart.
      - name: npm run check:breaking -- --base <base>
        if: success() || failure()
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: npm run check:breaking -- --base "$BASE"

  # The vocabulary, the deck library and pod catalog documents, checked
  # again by an independent SHACL engine (pySHACL), SPARQL constraints
  # included. It reads only files in the repository (no npm install, no
  # generated code, no build), so it runs beside check rather than after
  # it, and the deploy waits for it like every other job here.
  # Deterministic.
  crosscheck:
    needs: gate
    if: needs.gate.outputs.jobs == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - run: pip install -r scripts/requirements-ci.txt
      # The script's own tests (scripts/test_shacl_crosscheck.py), on
      # small documents of their own, before it checks the real ones, and
      # the taxonomy deck generator's (scripts/test_taxonomy_deck.py).
      - run: python -m unittest discover -s scripts
      - run: python scripts/shacl_crosscheck.py

  # The app's use cases and Solid adapters against real Solid servers,
  # one job per server (e2e/pod/servers.ts): each pulls or builds only its
  # server's image, or loads it from GitHub's cache (e2e-images), starts it
  # in Docker on this runner and runs the whole suite (docs/testing.md). One server failing does not stop the others;
  # what the server printed is kept when its job fails. Only a run on main
  # saves the images; elsewhere, new images are pulled through the mirror.
  # Timing-dependent: real servers, started on a shared runner. Where it is
  # skipped on main, warm saves the images it would have.
  pod:
    name: pod (${{ matrix.server }})
    needs: gate
    if: needs.gate.outputs.jobs == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [css-7, css-6, nss-6, nss-5, css-acp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: key
        run: echo "key=$(node e2e/pod/servers.ts key ${{ matrix.server }})" >> "$GITHUB_OUTPUT"
      - id: images
        uses: ./.github/actions/e2e-images
        with:
          name: pod-${{ matrix.server }}
          key: ${{ steps.key.outputs.key }}
      - run: npm run servers -w @solid-memo/e2e-pod -- ${{ matrix.server }}
      - if: steps.images.outputs.hit != 'true' && github.ref == 'refs/heads/main'
        env:
          FILE: ${{ steps.images.outputs.file }}
        run: node e2e/pod/images.ts save "$FILE" e2e/pod/servers/${{ matrix.server }}/compose.yml
      - if: steps.images.outputs.hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.images.outputs.file }}
          key: ${{ steps.images.outputs.key }}
      - run: npm run test:pod
        env:
          SOLID_SERVERS: ${{ matrix.server }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pod-logs-${{ matrix.server }}
          path: e2e/pod/logs/
          retention-days: 7

  # The advisory servers (docs/testing.md) only report, in the Interop
  # workflow, but each must still start and meet the harness's contract:
  # a change that breaks one fails here, not unnoticed until Interop runs.
  # Timing-dependent: real servers, which must start in time.
  contract:
    name: contract (${{ matrix.server }})
    needs: gate
    if: needs.gate.outputs.jobs == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [css-8, pivot, nextcloud, jss]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: key
        run: echo "key=$(node e2e/pod/servers.ts key ${{ matrix.server }})" >> "$GITHUB_OUTPUT"
      - id: images
        uses: ./.github/actions/e2e-images
        with:
          name: pod-${{ matrix.server }}
          key: ${{ steps.key.outputs.key }}
      - run: npm run servers -w @solid-memo/e2e-pod -- ${{ matrix.server }}
      - if: steps.images.outputs.hit != 'true' && github.ref == 'refs/heads/main'
        env:
          FILE: ${{ steps.images.outputs.file }}
        run: node e2e/pod/images.ts save "$FILE" e2e/pod/servers/${{ matrix.server }}/compose.yml
      - if: steps.images.outputs.hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.images.outputs.file }}
          key: ${{ steps.images.outputs.key }}
      - run: node e2e/pod/servers.ts contract ${{ matrix.server }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-logs-${{ matrix.server }}
          path: e2e/pod/logs/
          retention-days: 7

  # The user journeys (e2e/journeys, docs/testing.md): the site job's
  # build of the app, served by vite preview, in Chromium, logging in to
  # a Community Solid Server 7 behind TLS that the harness starts in
  # Docker, each journey with an account and pod of its
  # own. The other engines and the phone run a few of them
  # (docs/testing.md#browsers). Five jobs run them side by side, so the
  # run waits for the slowest, not for all: Chromium's journeys in two
  # shards (npx playwright --shard), and each other engine's in a job of
  # its own, so that WebKit's and the phone's, the slowest, never land
  # together. Each job pays the setup again (about a minute), for a
  # shorter wall time. When one
  # fails, the job's summary names the step it failed in, and its
  # artifact holds the trace to replay it step
  # by step (`npx playwright show-trace`), the report, a video, and the
  # server's log. On main and in the merge queue the traces are kept
  # always, and each job keeps its run as a blob, for journeys-report to
  # merge: main's report takes them from the run that tested its tree
  # when it skips them (gate's tested-by), the queue's as a rule.
  # Timing-dependent: end to end, waiting on a real server behind TLS,
  # on a shared runner. Their waits are fixed where they flake, not
  # retried (retries: 0, playwright.config.ts).
  journeys:
    name: journeys (${{ matrix.name }})
    needs: [gate, site]
    if: needs.gate.outputs.jobs == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # name: the job's, and its blob's (journeys-report lists them);
      # projects: what it runs; browser: what it installs, and the key it
      # is kept under, the phone's being WebKit's.
      matrix:
        include:
          - name: chromium-1
            projects: --project=chromium --shard=1/2
            browser: chromium
          - name: chromium-2
            projects: --project=chromium --shard=2/2
            browser: chromium
          - name: firefox
            projects: --project=firefox
            browser: firefox
          - name: webkit
            projects: --project=webkit
            browser: webkit
          - name: phone
            projects: --project=phone
            browser: webkit
    env:
      JOURNEY_TRACE: >-
        ${{ (inputs.trace || github.ref == 'refs/heads/main' ||
        github.event_name == 'merge_group') && 'on' || '' }}
      # The blob's name, so the jobs' blobs sit side by side when merged.
      PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.name }}.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}
      - uses: ./.github/actions/playwright-deps
        with:
          browser: ${{ matrix.browser }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: apps/web/dist/
      - id: images
        uses: ./.github/actions/e2e-images
        with:
          name: journeys
          key: ${{ hashFiles('e2e/journeys/css/compose.yml') }}
      - run: npm run css:prepare -w @solid-memo/e2e-journeys
      - if: steps.images.outputs.hit != 'true' && github.ref == 'refs/heads/main'
        env:
          FILE: ${{ steps.images.outputs.file }}
        run: node e2e/pod/images.ts save "$FILE" e2e/journeys/css/compose.yml
      - if: steps.images.outputs.hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.images.outputs.file }}
          key: ${{ steps.images.outputs.key }}
      - run: npm run journeys -- ${{ matrix.projects }}
      - if: always()
        run: node e2e/journeys/harness/summary.ts journeys-${{ matrix.name }}-${{ github.run_attempt }}
      # In the queue, the blob below holds the traces; this, only on a failure.
      - if: failure() || (env.JOURNEY_TRACE == 'on' && github.event_name != 'merge_group')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journeys-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            e2e/journeys/playwright-report/
            e2e/journeys/test-results/
            e2e/journeys/logs/
          retention-days: 7
      # A job run again replaces its blob from the attempt before; kept as
      # long as the report, so that re-running one job still finds the
      # other's.
      - if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'merge_group')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journeys-blob-${{ matrix.name }}
          path: e2e/journeys/blob-report/
          retention-days: 7
          overwrite: true

  # On main, the journeys jobs' runs merged into one report, every
  # browser's journeys and their traces in it, even when a journey failed:
  # the deploy publishes it at /journeys/ (docs/deployment.md). When this
  # run skipped the journeys, their blobs come from the run gate names,
  # which ran them on this tree: the merge queue's, or a release commit's
  # parent's. When the journeys passed, or ran there, every job's blob
  # must be there, so a run the deploy may publish never has a report
  # missing a browser. ci-ok doesn't need it, as it runs on main alone;
  # its failure still fails the run, and so holds back release and
  # deploy. Deterministic.
  journeys-report:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: [gate, journeys]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To download the journeys' blobs from the run that tested this tree.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - if: needs.gate.outputs.jobs == 'all'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: journeys-blob-*
          merge-multiple: true
          path: e2e/journeys/blob-reports/
      - if: needs.gate.outputs.jobs == 'reuse'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: journeys-blob-*
          merge-multiple: true
          run-id: ${{ needs.gate.outputs.tested-by }}
          github-token: ${{ github.token }}
          path: e2e/journeys/blob-reports/
      - working-directory: e2e/journeys
        env:
          JOURNEYS: ${{ needs.journeys.result }}
          JOBS: ${{ needs.gate.outputs.jobs }}
          # The journeys jobs' names, as their matrix has them.
          REPORTS: chromium-1 chromium-2 firefox webkit phone
        run: |
          if [ "$JOURNEYS" = success ] || [ "$JOBS" = reuse ]; then
            for name in $REPORTS; do
              test -f "blob-reports/report-$name.zip"
            done
          fi
          if compgen -G 'blob-reports/*.zip' > /dev/null; then
            npx playwright merge-reports --reporter html blob-reports
          fi
      - if: hashFiles('e2e/journeys/playwright-report/index.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journeys-report
          path: e2e/journeys/playwright-report/
          retention-days: 7
          overwrite: true

  # On main, when this run reuses the one that tested its tree (gate's
  # jobs=reuse, tested-by), what that run made is taken over, not made
  # again: its site, kept as this run's site artifact, which the deploy
  # ships (docs/deployment.md), and, but on a release commit, its Turbo
  # cache, saved as main's, which every pull request and queue run
  # restores. That run tested this very tree: the queue's commit is the
  # one main moved to, and a release commit's code is its parent's. On a
  # release commit, main's Turbo cache holds its parent's already. It runs
  # none of the repository's code, so it needs no checkout. Deterministic.
  reuse:
    if: needs.gate.outputs.jobs == 'reuse'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To download the site and Turbo's cache from the run that tested this tree.
      actions: read
    env:
      RELEASE: >-
        ${{ startsWith(github.event.head_commit.message, 'chore(release): ') }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          run-id: ${{ needs.gate.outputs.tested-by }}
          github-token: ${{ github.token }}
          path: site/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - if: env.RELEASE != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: turbo-cache
          run-id: ${{ needs.gate.outputs.tested-by }}
          github-token: ${{ github.token }}
          path: .turbo/cache/
      - if: env.RELEASE != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}

  # A release commit's own files, when this run reuses the one that tested
  # its parent: the gate has checked that it changes nothing else, and
  # its code is its parent's, so these are what it can get wrong. Biome's
  # rules (package.json), markdownlint's and cspell's (CHANGELOG.md), as
  # npm run check has them, and publiccode.yml, by its parser.
  # Deterministic.
  release-files:
    if: >-
      needs.gate.outputs.jobs == 'reuse' &&
      startsWith(github.event.head_commit.message, 'chore(release): ')
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:markdown
      - run: npm run lint:spelling
      - uses: ./.github/actions/publiccode
        with:
          network: "false"

  # On main, when this run reuses another and the jobs that test are
  # skipped, the caches they would have saved there, which every pull
  # request and queue run reads: each server's images and the journeys'
  # (e2e-images), the journeys' browsers, and Chromium's headless shell
  # (.github/actions/chromium), and their system libraries
  # (.github/actions/playwright-deps). This job only looks them up, by the keys
  # those jobs use; warm-images and warm-browsers make and save what is
  # missing, and nothing else, so a run with every cache in place spends
  # one short job; warm-pip, pip's. Like caches, they may fail without
  # failing the run. Deterministic.
  warm:
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.jobs == 'reuse'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      # To list main's caches.
      actions: read
    outputs:
      images: ${{ steps.missing.outputs.images }}
      browsers: ${{ steps.missing.outputs.browsers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # shell: bash runs with pipefail, so a listing that fails fails the
      # step instead of finding every cache missing.
      - name: What main's cache lacks
        id: missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOURNEYS_KEY: ${{ hashFiles('e2e/journeys/css/compose.yml') }}
        run: |
          # Listed once each, outside any condition, where a failure
          # fails the step: inside one, bash would read it as a miss.
          listed=$(gh cache list --ref refs/heads/main --key e2e-images- --limit 1000 --json key)
          listed+=$(gh cache list --ref refs/heads/main --key playwright- --limit 1000 --json key)
          cached() {
            jq -se --arg key "$1" 'add | any(.[]; .key == $key)' <<< "$listed" > /dev/null
          }
          # Named as e2e-images names them: pod-<server>, and journeys.
          keys=$(node e2e/pod/servers.ts keys all | sed 's/^/pod-/')
          keys+=$'\n'"journeys $JOURNEYS_KEY"
          images=()
          while read -r name key; do
            cached "e2e-images-$RUNNER_OS-$RUNNER_ARCH-$name-$key" || images+=("$name")
          done <<< "$keys"
          echo "Images missing: ${images[*]:-none}"
          echo "images=$(jq -cn '$ARGS.positional' --args "${images[@]}")" >> "$GITHUB_OUTPUT"
          version=$(node -p "require('@playwright/test/package.json').version")
          browsers=()
          # The journeys matrix's caches.
          for name in chromium firefox webkit; do
            cached "playwright-$RUNNER_OS-$version-$name" || browsers+=("$name")
          done
          # The headless shell check and site draw the docs' diagrams in,
          # under the chromium action's key, by site's playwright.
          shell=$(node -p "require('playwright/package.json').version")
          cached "playwright-shell-$RUNNER_OS-$shell" || browsers+=("shell")
          # The system libraries, under this runner's image: a job's may
          # be another while GitHub rolls a new one out. A browser listed
          # already gets them too; the headless shell's are Chromium's.
          core=$(node -p "require('playwright-core/package.json').version")
          for name in chromium firefox webkit; do
            cached "playwright-deps-$name-$ImageOS-$ImageVersion-$RUNNER_ARCH-$core" ||
              [[ " ${browsers[*]} " == *" $name "* ]] || browsers+=("$name")
          done
          echo "Browsers missing: ${browsers[*]:-none}"
          echo "browsers=$(jq -cn '$ARGS.positional' --args "${browsers[@]}")" >> "$GITHUB_OUTPUT"

  # Missing images, pulled or built as pod, contract and journeys would,
  # and saved under their key. Deterministic.
  warm-images:
    if: needs.warm.outputs.images != '' && needs.warm.outputs.images != '[]'
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        images: ${{ fromJSON(needs.warm.outputs.images) }}
    # The names come from an output, so they reach the shell as a
    # variable, never written into a script.
    env:
      IMAGES: ${{ matrix.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: key
        env:
          JOURNEYS_KEY: ${{ hashFiles('e2e/journeys/css/compose.yml') }}
        run: |
          if [ "$IMAGES" = journeys ]; then
            echo "key=$JOURNEYS_KEY" >> "$GITHUB_OUTPUT"
            echo "compose=e2e/journeys/css/compose.yml" >> "$GITHUB_OUTPUT"
          else
            echo "key=$(node e2e/pod/servers.ts key "${IMAGES#pod-}")" >> "$GITHUB_OUTPUT"
            echo "compose=e2e/pod/servers/${IMAGES#pod-}/compose.yml" >> "$GITHUB_OUTPUT"
          fi
      - id: images
        uses: ./.github/actions/e2e-images
        with:
          name: ${{ matrix.images }}
          key: ${{ steps.key.outputs.key }}
      - run: |
          if [ "$IMAGES" = journeys ]; then
            npm run css:prepare -w @solid-memo/e2e-journeys
          else
            npm run servers -w @solid-memo/e2e-pod -- "${IMAGES#pod-}"
          fi
      - if: steps.images.outputs.hit != 'true'
        env:
          FILE: ${{ steps.images.outputs.file }}
          COMPOSE: ${{ steps.key.outputs.compose }}
        run: node e2e/pod/images.ts save "$FILE" "$COMPOSE"
      - if: steps.images.outputs.hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.images.outputs.file }}
          key: ${{ steps.images.outputs.key }}

  # A journeys job's missing browser, downloaded as it would (its
  # matrix's browser), or the missing headless shell, as the chromium
  # action downloads it, and saved under the key it is restored by; and
  # a browser's missing system libraries, which playwright-deps saves.
  # Deterministic.
  warm-browsers:
    if: needs.warm.outputs.browsers != '' && needs.warm.outputs.browsers != '[]'
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browsers: ${{ fromJSON(needs.warm.outputs.browsers) }}
    env:
      BROWSERS: ${{ matrix.browsers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: key
        run: |
          if [ "$BROWSERS" = shell ]; then
            echo "key=playwright-shell-$RUNNER_OS-$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          else
            echo "key=playwright-$RUNNER_OS-$(node -p "require('@playwright/test/package.json').version")-$BROWSERS" >> "$GITHUB_OUTPUT"
          fi
      # A browser listed for its system libraries alone is in the cache
      # already, and only looked up.
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: |
          if [ "$BROWSERS" = shell ]; then
            npx playwright install --only-shell chromium
          else
            npx playwright install "$BROWSERS"
          fi
      - if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.key.outputs.key }}
      - if: matrix.browsers != 'shell'
        uses: ./.github/actions/playwright-deps
        with:
          browser: ${{ matrix.browsers }}

  # On main, when this run reuses another, pip's caches, which crosscheck,
  # docs and workflows restore in every pull request and queue run, under
  # setup-python's keys: the Python tools installed, so setup-python
  # saves each when main lacks it. A key main has is only restored. Like
  # caches, it may fail without failing the run. Deterministic.
  warm-pip:
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.jobs == 'reuse'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - run: pip install -r scripts/requirements-ci.txt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: scripts/requirements-lint.txt
      - run: pip install -r scripts/requirements-lint.txt

  # The docs (docs/testing.md#documentation): every link to a file or a
  # heading in the repository resolves (lychee, offline: the web's
  # addresses are checked weekly, by links.yml, so a site that is down
  # fails no change), publiccode.yml, once there, is valid, and every
  # file states its copyright and license, as REUSE has it (`reuse lint`,
  # docs/style.md#licenses). The Markdown's style and spelling are
  # npm run check's, in check. None of these tools is an npm package, so
  # the job installs no npm packages: reuse comes from PyPI, pinned in
  # scripts/requirements-lint.txt, not as fsfe/reuse-action's Docker
  # image, which Docker Hub's limit on pulls without an account, shared
  # by the runners, could refuse, and which names its image by a tag. Deterministic.
  docs:
    needs: gate
    if: needs.gate.outputs.jobs == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: scripts/requirements-lint.txt
      # pip installs outside the checkout, so only the repository's own
      # files are there to check.
      - run: pip install -r scripts/requirements-lint.txt
      - run: npm run lint:reuse
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline '**/*.md'
          output: ${{ runner.temp }}/lychee.md
          jobSummary: false
      - uses: ./.github/actions/publiccode
        with:
          network: "false"

  # The workflows and actions themselves (docs/testing.md#the-workflows):
  # actionlint checks their syntax, expressions and shell (with
  # shellcheck), zizmor their security, such as an expression written
  # into a script or a job given more rights than it uses. Offline:
  # zizmor's audits that ask GitHub's API are left out. Both are Python
  # packages, pinned in scripts/requirements-lint.txt. Deterministic.
  workflows:
    needs: gate
    if: needs.gate.outputs.jobs == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: scripts/requirements-lint.txt
      - run: pip install -r scripts/requirements-lint.txt
      - run: npm run lint:workflows

  # A pull request's commits follow Conventional Commits
  # (CONTRIBUTING.md#commit-messages), as commitlint.config.mjs has them:
  # semantic-release chooses each version from them (docs/releasing.md),
  # and a commit it cannot read is left out of the release. Each one has
  # a body that says why, and names its issue, pull request or
  # discussion, as criterion 6 of the Standard for Public Code asks
  # (docs/standard-for-public-code.md). Only the commits the pull request
  # adds are linted, from its base to its head. commitlint skips a merge
  # commit, so a pull request with one fails: its branch is updated by
  # rebasing, and the merge queue builds on main anyway. Neither the
  # merge queue nor a push to main is linted: their commits were linted
  # in their pull request, and the release commit is written by
  # semantic-release.
  #
  # The pull request closes its issue (CONTRIBUTING.md#commit-messages):
  # its body or a commit has `Closes: #NN` (or Fixes, Resolves), or the
  # body has `Refs: #NN` and the template's "One step" box checked.
  # GitHub closes an issue on merge for nothing else. The body is read
  # from the API when the step runs, not from the event, so editing it
  # and running the job again is enough. Renovate's pull requests have
  # no issue, and are left out, as commitlint leaves out their commits.
  # Deterministic.
  commits:
    needs: gate
    if: needs.gate.outputs.jobs == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - if: github.event_name != 'pull_request'
        run: echo "Only a pull request's commits are linted; this run is for a ${{ github.event_name }}."
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: github.event_name == 'pull_request'
        run: npm ci
      - if: github.event_name == 'pull_request'
        name: npx commitlint --from <base> --to <head>
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE" --to "$HEAD" --verbose
      - if: github.event_name == 'pull_request'
        name: No merge commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          merges=$(git rev-list --merges "$BASE..$HEAD")
          if [ -n "$merges" ]; then
            echo "::error::These merge commits are not linted: $merges. Update the branch by rebasing it on main instead (git rebase origin/main)."
            exit 1
          fi
      - if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]' && (success() || failure())
        name: npm run check:closes -- --base <base> --head <head> --body-file <body>
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$RUNNER_TEMP/body.md"
          gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""' > "$body"
          npm run check:closes -- --base "$BASE" --head "$HEAD" --body-file "$body"

  # The one check a merge to main waits for (the ruleset on main is to
  # require it). The gate must pass; then, when the run tests its tree
  # (jobs=all), every job that tests it must pass, and when it reuses the
  # run that did (jobs=reuse), reuse must pass, and release-files too on
  # a release commit, the jobs that test being skipped. journeys-report,
  # caches and the warm jobs are not among them. Every job it needs is
  # the gate or in one of its two lists, or it fails. A matrix job's
  # checks are named per server, and jobs come and go; this name stays.
  ci-ok:
    if: always()
    needs:
      [gate, check, site, library, crosscheck, pod, contract, journeys, docs, workflows, commits,
       reuse, release-files]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or the gate's choice skipped it
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          GATE: ${{ needs.gate.result }}
          TESTS: >-
            ${{ needs.check.result }} ${{ needs.site.result }} ${{ needs.library.result }}
            ${{ needs.crosscheck.result }} ${{ needs.pod.result }} ${{ needs.contract.result }}
            ${{ needs.journeys.result }} ${{ needs.docs.result }}
            ${{ needs.workflows.result }} ${{ needs.commits.result }}
          REUSE: ${{ needs.reuse.result }}
          RELEASE_FILES: ${{ needs.release-files.result }}
          RELEASE: >-
            ${{ startsWith(github.event.head_commit.message, 'chore(release): ') }}
          JOBS: ${{ needs.gate.outputs.jobs }}
        run: |
          echo "The jobs' results: $RESULTS (gate: ${JOBS:-none})"
          read -ra all <<< "$RESULTS"
          read -ra tests <<< "$TESTS"
          [ "${#all[@]}" -eq $(( 3 + ${#tests[@]} )) ] || {
            echo "::error::ci-ok needs a job neither of its lists names: add it to one."
            exit 1
          }
          [ "$GATE" = success ] || exit 1
          case "$JOBS" in
            all)
              for result in "${tests[@]}"; do
                [ "$result" = success ] || exit 1
              done
              ;;
            reuse)
              for result in "${tests[@]}"; do
                [ "$result" = skipped ] || exit 1
              done
              [ "$REUSE" = success ] || exit 1
              if [ "$RELEASE" = true ]; then
                [ "$RELEASE_FILES" = success ] || exit 1
              fi
              ;;
            *)
              exit 1
              ;;
          esac
