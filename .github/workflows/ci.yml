name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      trace:
        description: Keep the user journeys' traces, videos and screenshots even when they pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      - run: npm ci
      # Every package: typecheck, tests at 100% coverage, generated code and
      # Turtle formatting in step with their sources, and the deck library
      # (ns.yml also compares it with the base); then the boundaries.
      - run: npm run check
      - run: npm run build

  # The vocabulary, the deck library and pod catalog documents, checked
  # again by an independent SHACL engine (pySHACL), SPARQL constraints
  # included. It reads only files in the repository (no npm install, no
  # generated code, no build), so it runs beside build rather than after
  # it, and the deploy waits for it like every other job here.
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - run: pip install -r scripts/requirements-ci.txt
      - run: python scripts/shacl_crosscheck.py

  # The app's use cases and Solid adapters against real Solid servers,
  # one job per server (e2e/pod/servers.ts): each pulls or builds only its
  # server's image, or loads it from GitHub's cache (e2e-images), starts it
  # in Docker on this runner and runs the whole suite (docs/testing.md). One server failing does not stop the others;
  # what the server printed is kept when its job fails.
  pod:
    name: pod (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [css-7, css-6, nss-6, nss-5, css-acp]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: key
        run: echo "key=$(node e2e/pod/servers.ts key ${{ matrix.server }})" >> "$GITHUB_OUTPUT"
      - id: images
        uses: ./.github/actions/e2e-images
        with:
          name: pod-${{ matrix.server }}
          key: ${{ steps.key.outputs.key }}
      - run: npm run servers -w @solid-memo/e2e-pod -- ${{ matrix.server }}
      - if: steps.images.outputs.hit != 'true'
        run: node e2e/pod/images.ts save "${{ steps.images.outputs.file }}" e2e/pod/servers/${{ matrix.server }}/compose.yml
      - if: steps.images.outputs.hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ steps.images.outputs.file }}
          key: ${{ steps.images.outputs.key }}
      - run: npm run test:pod
        env:
          SOLID_SERVERS: ${{ matrix.server }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pod-logs-${{ matrix.server }}
          path: e2e/pod/logs/
          retention-days: 7

  # The advisory servers (docs/testing.md) only report, in the Interop
  # workflow, but each must still start and meet the harness's contract:
  # a change that breaks one fails here, not unnoticed until Interop runs.
  contract:
    name: contract (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [css-8, pivot, nextcloud, jss]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: key
        run: echo "key=$(node e2e/pod/servers.ts key ${{ matrix.server }})" >> "$GITHUB_OUTPUT"
      - id: images
        uses: ./.github/actions/e2e-images
        with:
          name: pod-${{ matrix.server }}
          key: ${{ steps.key.outputs.key }}
      - run: npm run servers -w @solid-memo/e2e-pod -- ${{ matrix.server }}
      - if: steps.images.outputs.hit != 'true'
        run: node e2e/pod/images.ts save "${{ steps.images.outputs.file }}" e2e/pod/servers/${{ matrix.server }}/compose.yml
      - if: steps.images.outputs.hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ steps.images.outputs.file }}
          key: ${{ steps.images.outputs.key }}
      - run: node e2e/pod/servers.ts contract ${{ matrix.server }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract-logs-${{ matrix.server }}
          path: e2e/pod/logs/
          retention-days: 7

  # The user journeys (e2e/journeys, docs/testing.md): the built app in
  # Chromium, logging in to a Community Solid Server 7 behind TLS that the
  # harness starts in Docker, each journey with an account and pod of its
  # own. When one fails, the job's summary names the step it failed in, and
  # its artifact holds the trace to replay it step by step (`npx playwright
  # show-trace`), the report, a video, and the server's log. On main the
  # traces are kept always: the deploy publishes the report, trace viewer
  # and all, at /journeys/ (docs/deployment.md).
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JOURNEY_TRACE: ${{ (inputs.trace || github.ref == 'refs/heads/main') && 'on' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx turbo run build --filter=@solid-memo/web
      - id: images
        uses: ./.github/actions/e2e-images
        with:
          name: journeys
          key: ${{ hashFiles('e2e/journeys/css/compose.yml') }}
      - run: npm run css:prepare -w @solid-memo/e2e-journeys
      - if: steps.images.outputs.hit != 'true'
        run: node e2e/pod/images.ts save "${{ steps.images.outputs.file }}" e2e/journeys/css/compose.yml
      - if: steps.images.outputs.hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ steps.images.outputs.file }}
          key: ${{ steps.images.outputs.key }}
      - run: npm run journeys
      - if: always()
        run: node e2e/journeys/harness/summary.ts journeys-${{ github.run_attempt }}
      - if: failure() || env.JOURNEY_TRACE == 'on'
        uses: actions/upload-artifact@v7
        with:
          name: journeys-${{ github.run_attempt }}
          path: |
            e2e/journeys/playwright-report/
            e2e/journeys/test-results/
            e2e/journeys/logs/
          retention-days: 7
      - if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: journeys-report
          path: e2e/journeys/playwright-report/
          retention-days: 7
