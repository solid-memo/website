name: Vocabulary, shapes and decks

# What the site publishes under ns/ and decks/ (docs/vocab.md,
# docs/shapes.md, docs/deck-library.md), checked whenever it or the code
# that reads it changes: the Turtle in the house style, the deck library
# valid with its index up to date, no published version edited or
# removed since the base of the change and every version new since then
# naming the library's contact, not an email, the generated code in step with
# the vocabulary and the shapes, and their tests. CI runs most of this
# too, and gates merges and the deploy; it also runs pySHACL's
# cross-check, which is not repeated here. This workflow adds the
# comparison with the base. Like CI, it runs on pull requests and on
# pushes to main, not on other branches' pushes, so a pull request's
# commits are checked once. It is not a required check: a change that
# touches none of these paths never runs it.

on:
  pull_request:
    paths: &paths
      - ns/**
      - decks/**
      - packages/vocab/**
      - packages/shacl/**
      - packages/turtle/**
      - packages/domain/**
      - packages/markdown/**
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/ns.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ns-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history: the library is compared with an earlier commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-ns-${{ github.sha }}
          restore-keys: |
            turbo-ns-
            turbo-
      - run: npm ci
      - run: npm run format:turtle:check
      # A published version (decks/<name>/v<N>.ttl) is never edited or
      # removed: on a push to the default branch, compare with the commit
      # the push moved it from; on a pull request (its merge with the
      # default branch) or a run by hand, with where it left the default
      # branch, so a version not merged yet can still be fixed there. A
      # version not published at that commit names the library's contact
      # and no email (docs/deck-library.md, Contact). A push that created
      # the default branch (all zeros), or one whose earlier commit a force
      # push left unfetched, compares with the default branch.
      - name: npm run library:check -- --base <base>
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi
          echo "Comparing the library with $base"
          npm run library:check -- --base "$base"
      - run: npm run generate:check
      - run: npx turbo run test --filter=@solid-memo/vocab --filter=@solid-memo/shacl --filter=@solid-memo/turtle --filter=@solid-memo/markdown
