# Chromium's headless shell, which the build draws the docs' Mermaid
# diagrams in (docs/markdown.md), for a job that runs npm run check,
# builds the site or archives a release's docs (npm run docs:archive):
# from GitHub's cache, under the version of `playwright`
# (packages/site/package.json), which fixes the browser's build. The
# system libraries it needs come from playwright-deps, from GitHub's
# cache too. Run it after npm ci, which installs that version.
#
# A shell the cache lacks is downloaded and checked against the SHA-256
# committed in actions/headless-shell, not installed by Playwright,
# whose download checks no hash. With `cache: false`, nothing comes
# from GitHub's cache: the shell is downloaded and checked so, the
# libraries come from Ubuntu's signed mirror, and nothing is saved. A
# job that holds a secret, attests what it makes or builds the site
# that is deployed uses that
# (release.yml's release job, ci.yml's site job, deploy.yml's build job;
# release.yml's docs job, which checks out a tag, installs them with a
# step of its own): any
# job on main can write main's cache entries, so what a job restores
# from them is only as trustworthy as the least trusted of those jobs.
#
# The key is not the journeys job's (ci.yml): that job installs the full
# Chromium, and neither may restore a cache that lacks its browser. Nor
# is it the one the shell was cached under while Playwright installed
# it, unchecked and with FFmpeg: no entry saved then is restored.
name: Chromium
description: Restores or installs the Chromium headless shell that draws the docs' diagrams.
inputs:
  cache:
    description: Whether to restore the shell and its libraries from GitHub's cache, and save them there (true or false).
    default: "true"
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
    - id: cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-headless-shell-${{ runner.os }}-${{ steps.version.outputs.version }}
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/headless-shell
    - uses: ./.github/actions/playwright-deps
      with:
        browser: chromium
        cache: ${{ inputs.cache }}
