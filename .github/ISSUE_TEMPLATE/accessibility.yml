name: Accessibility barrier
description: Something in Solid Memo or the Studio is hard or impossible to use with your setup.
labels: [accessibility]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. You don't need to say anything about yourself or a disability, only about the barrier. How a report is handled is in [ACCESSIBILITY.md](https://github.com/solid-memo/website/blob/main/ACCESSIBILITY.md). A security issue goes to a [private report](https://github.com/solid-memo/website/security/advisories/new) instead, never here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you tried to do, what happened, and what you expected instead.
      placeholder: I tried to grade a card with the keyboard, but the focus …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
        3. Hear or see …
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page's address (the part from `#/` on is enough), or "the Studio".
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit the footer links to.
  - type: input
    id: browser
    attributes:
      label: Browser and system
      description: The browser, its version, and the system it runs on. The [supported browsers](https://github.com/solid-memo/website/blob/main/docs/user-guide.md#supported-browsers) are the current Chrome, Edge, Firefox and Safari.
      placeholder: Safari 26 on iOS 26
  - type: input
    id: assistive
    attributes:
      label: Assistive technology
      description: A screen reader, magnifier, voice control, switch or other tool you use, and its version. Settings help too, such as zoom, text size or reduced motion. Leave it empty if you use none.
      placeholder: VoiceOver on iOS 26, text size at the largest
  - type: dropdown
    id: severity
    attributes:
      label: How much it stops you
      description: Leave it if you're not sure; the maintainer sets it when sorting the report.
      options:
        - "Critical: I can't do a core task, such as studying a deck"
        - "Serious: it's hard, but I found a way around it"
        - "Moderate: it's an annoyance, or it behaves inconsistently"
        - "Minor: it has little effect on using the app"
        - I do not know
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A way around it you found, or a screenshot or recording, if you're comfortable sharing one. Leave out tokens and anything private from your pod.
