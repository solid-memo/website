<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- What the page may load and run (docs/markdown.md). GitHub Pages sets no
       headers, so the policy is a meta tag, first, before anything it covers.
       Script only from the site itself, and the first-paint script below by its
       hash (src/build.test.ts checks it still matches); no plugins, no
       <base>, no form posted anywhere. Pictures come from pods, so img-src
       stays open; style-src waits on the inline styles of src/ui. -->
  <meta http-equiv="Content-Security-Policy"
    content="script-src 'self' 'sha256-o/OkTyg5paAjpiXKPEbN6jdtH/hBgznG3HB8dXsFsCU='; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Spaced-repetition flashcards that live in your own Solid pod." />
  <!-- The site's version, from the root package.json, put in by
       vite.config.ts; the footer and error reports read it from here
       (src/config.ts). In the page rather than in the script, whose file
       is named by a hash of its content, so a built site can be given
       another version without touching its script (docs/configuration.md). -->
  <meta name="version" content="%APP_VERSION%" />
  <meta name="theme-color" content="#f7f6f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#11171e" media="(prefers-color-scheme: dark)" />
  <!-- The theme, the palette and the text size before the first paint,
       so the page does not flash in other colors or at another size: the
       choices kept on this device (under the keys of the browser
       package's localStorage{Theme,Palette,TextSize}Preference.ts), else
       the browser's. A palette or a text size is set as it is stored, if
       it is in the form every one is, so a later one needs no change here
       (or to the hash above). A palette of the user's own has its colors
       for the theme set on the root (key solid-memo:palette-colors, of
       localStorageCustomPalettePreference.ts), each only for a role it may
       set and only if it is #rrggbb. The app takes over from here
       (src/ui/theme.tsx). -->
  <script>
    (function () {
      var root = document.documentElement;
      function stored(key) {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          return null;
        }
      }
      var chosen = stored("solid-memo:theme");
      root.dataset.theme =
        chosen === "light" || chosen === "dark" ? chosen
        : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      var name = /^[a-z][a-z-]{0,31}$/;
      var palette = stored("solid-memo:palette");
      if (palette !== null && name.test(palette)) root.dataset.palette = palette;
      var size = stored("solid-memo:textSize");
      if (size !== null && name.test(size)) root.dataset.textSize = size;
      var role =
        /^--(bg|surface(-sunken|-hover)?|text(-muted)?|border(-strong)?|control-border|primary(-fill|-hover|-soft)?|on-primary|link(-hover-bg)?|danger(-soft|-border)?|warning-(text|soft|border)|grade-[0-5])$/;
      try {
        var colors = JSON.parse(stored("solid-memo:palette-colors"))[root.dataset.theme];
        for (var key in colors) {
          var color = colors[key];
          if (role.test(key) && typeof color === "string" && /^#[0-9a-fA-F]{6}$/.test(color))
            root.style.setProperty(key, color);
        }
      } catch (e) {}
    })();
  </script>
  <!-- Favicons at fixed root URLs (public/), not fingerprinted assets:
       search engines want a stable favicon URL, and look for /favicon.ico
       first. The .ico holds 16, 32 and 48 px renders of favicon.svg. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>%APP_NAME% - Spaced-repetition flashcards in your Solid pod</title>

  <!-- Search engines and link previews. The app routes by URL hash, so this
       one page is the only one there is to index. Absolute URLs because
       crawlers resolve og:image and canonical without the page's base.
       The site's name in the title, the og: tags and the JSON-LD is
       VITE_APP_NAME, and the repository in the JSON-LD and the noscript
       link is VITE_REPO_URL, put in by vite.config.ts
       (docs/configuration.md). -->
  <link rel="canonical" href="https://solid-memo.com/" />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="%APP_NAME%" />
  <meta property="og:title" content="%APP_NAME%" />
  <meta property="og:description" content="Spaced-repetition flashcards that live in your own Solid pod. Try it without an account." />
  <meta property="og:url" content="https://solid-memo.com/" />
  <meta property="og:image" content="https://solid-memo.com/social-preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The Solid Memo wordmark beside &quot;Spaced-repetition flashcards in your own Solid pod. Your decks, your progress, your data. Try it without an account.&quot;" />
  <meta property="og:locale" content="en" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- The app, and the source code it is built from: codeRepository is a
       property of SoftwareSourceCode, not of WebApplication, so the source
       is a node of its own whose targetProduct is the app. inLanguage is
       the languages the app speaks (docs/i18n.md): a new one goes here
       and in src/build.test.ts, which checks these fields. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "@id": "https://solid-memo.com/#app",
          "name": %APP_NAME_JSON%,
          "url": "https://solid-memo.com/",
          "description": "Spaced-repetition flashcards that live in your own Solid pod.",
          "applicationCategory": "EducationalApplication",
          "operatingSystem": "Any",
          "browserRequirements": "Requires JavaScript",
          "image": "https://solid-memo.com/social-preview.png",
          "inLanguage": ["en", "sv", "ko", "de", "es", "fr"],
          "license": "https://spdx.org/licenses/MIT",
          "sameAs": [%REPO_URL_JSON%],
          "isAccessibleForFree": true,
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
        },
        {
          "@type": "SoftwareSourceCode",
          "@id": "https://solid-memo.com/#source",
          "name": %APP_NAME_JSON%,
          "codeRepository": %REPO_URL_JSON%,
          "license": "https://spdx.org/licenses/MIT",
          "programmingLanguage": "TypeScript",
          "inLanguage": "en",
          "targetProduct": { "@id": "https://solid-memo.com/#app" }
        }
      ]
    }
  </script>
</head>

<body>
  <!-- For a browser that runs no script, and for search engines: the app
       is built by script, so say what it is and where to read more. The
       About page and the docs are plain HTML, so they need none. -->
  <noscript>
    <p>Solid Memo needs JavaScript. Read <a href="about/">what Solid Memo is</a>,
      its <a href="docs/">documentation</a>, or its <a href="%REPO_URL%">source code</a>.</p>
  </noscript>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
