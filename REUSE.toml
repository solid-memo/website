# Who holds the copyright to each file and under which license it may be
# reused, as the REUSE specification (https://reuse.software/) has it:
# `reuse lint` checks that every file says so (docs/style.md#licenses).
#
# A file that can carry a comment says so in its own SPDX header. This file
# speaks for the rest: what cannot carry a comment (JSON, pictures), what
# is served as RDF and kept free of headers (the Turtle in decks/ and ns/,
# whose published versions are never edited) or is not ours (the vendored
# shapes), the docs' index, Turtle the formatter keeps free of headers,
# what tools write (the generated vocabulary, the lock files),
# the Markdown, kept free of headers so that it reads cleanly, and the
# HTML, whose first line is its doctype.
# Where several annotations match a file, the last one wins.
version = 1
SPDX-PackageName = "Solid Memo"
SPDX-PackageDownloadLocation = "https://github.com/solid-memo/website"

# The project's own files without a header of their own: MIT, as LICENSE
# and LICENSES/MIT.txt say.
[[annotations]]
path = [
    "**/*.md",
    "**/*.json",
    "**/*.png",
    "**/*.ico",
    "**/*.svg",
    # A page starts with its doctype, so its license is stated here.
    "**/*.html",
    ".nvmrc",
    "CNAME",
    # The vocabulary and the shapes, served as RDF (docs/vocab.md#license).
    "ns/**",
    # The docs' index, written by hand: Turtle, kept free of headers, as
    # the formatter keeps a comment only before a subject
    # (docs/markdown.md#the-docs-index).
    "docs/docs.ttl",
    # Test data.
    "packages/vocab/fixtures/**",
    "e2e/pod/servers/nss/seed/**",
    "e2e/pod/servers/nextcloud/open.acl",
    # Written by tools (.gitattributes).
    "packages/vocab/src/*.generated.ts",
    "packages/shacl/node/deckLibrary.golden.txt",
    # The Python tools' lock files, which `uv pip compile` writes whole
    # (docs/testing.md#the-workflows).
    "scripts/requirements-*.txt",
    # The public API, one promise a line, each file written by a test
    # (api/README.md).
    "api/**/*.txt",
    # The deck library's index, written by `npm run library`.
    "decks/index.ttl",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Anton Wiklund and Solid Memo contributors"
SPDX-License-Identifier = "MIT"

