# The Community Solid Server 8 with Linked Web Storage alone (the fork's
# own config/lws.json: files, a storage for each pod), from the image
# e2e/pod/servers/css-lws/ builds (`npm run servers -w @solid-memo/e2e-pod
# -- css-lws`), behind css/'s TLS, for a contributor to run the journeys
# on by hand (docs/lws.md): `E2E_PORT=<port> docker compose -f
# e2e/journeys/css-lws/compose.yml up -d`, then
# `JOURNEY_SERVER_URL=https://127.0.0.1:<port>/ npm run journeys` with the
# app built with `SOLID_CLIENT=solid-memo-client`. CI runs none.
services:
  tls:
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment: { E2E_PORT: "${E2E_PORT:?}" }
    volumes: ["../css/Caddyfile:/etc/caddy/Caddyfile:ro"]
    tmpfs: ["/data:uid=1000,gid=1000", "/config:uid=1000,gid=1000"]
    ports: ["127.0.0.1:${E2E_PORT:?}:${E2E_PORT:?}"]
    user: "1000:1000"
    cap_drop: [ALL]
    # Its binary carries this file capability, without which it cannot run.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 256
  server:
    image: localhost/solid-memo-e2e-css-lws:local
    pull_policy: never
    command: ["-c", "config/lws.json", "-f", "/data", "-b", "https://127.0.0.1:${E2E_PORT:?}/", "-l", "info"]
    network_mode: "service:tls"
    depends_on: [tls]
    # Caddy's CA is made as it starts, and this server is thrown away after
    # the run: it trusts whatever certificate its own requests meet, the
    # LWS token endpoint's discovery of its own OpenID provider among them.
    environment: { NODE_TLS_REJECT_UNAUTHORIZED: "0" }
    tmpfs: ["/data:uid=1000,gid=1000,mode=0700"]
    user: node
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 512
