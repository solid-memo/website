# Pivot, the server of solidcommunity.net, built from ./Dockerfile, in
# memory, its root open to anyone (pivot-e2e.json): an advisory server
# (docs/testing.md). The harness (../../servers.ts) sets E2E_PORT, the
# port on 127.0.0.1 it is reached at.
services:
  server:
    build: .
    image: localhost/solid-memo-e2e-pivot:local
    pull_policy: never
    command: ["-b", "http://127.0.0.1:${E2E_PORT:?}/", "-l", "warn"]
    ports: ["127.0.0.1:${E2E_PORT:?}:3000"]
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 512
