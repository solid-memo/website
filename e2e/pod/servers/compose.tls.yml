# The TLS in front of a server's signed-in instance (docs/testing.md):
# each <id>/signed-in.yml extends this service, and names the port its
# server listens on as E2E_UPSTREAM. Token verifiers refuse an issuer or
# WebID on http at 127.0.0.1, so the instance is reached over https, with
# a certificate of Caddy's own CA, which the tests trust. The server
# shares this service's network, so the address the tests use reaches
# Caddy from the server too: it dereferences the WebIDs and issuers of the
# tokens it verifies.
services:
  tls:
    image: caddy:2.11.8@sha256:4fcafa98afd1c2e642e353e3c5cf9ddbe892fcee14bc990e7ba2c5b78e51f9cf
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment: { E2E_PORT: "${E2E_PORT:?}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    tmpfs: ["/data:uid=1000,gid=1000", "/config:uid=1000,gid=1000"]
    ports: ["127.0.0.1:${E2E_PORT:?}:${E2E_PORT:?}"]
    user: "1000:1000"
    cap_drop: [ALL]
    # Its binary carries this file capability, without which it cannot run.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 256
