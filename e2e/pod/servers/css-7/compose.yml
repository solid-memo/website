# Community Solid Server 7, in memory, for the end-to-end tests
# (docs/testing.md): its default configuration lets anyone read and write.
# The harness (../../servers.ts) sets E2E_PORT, the port on 127.0.0.1 it
# is reached at; Renovate keeps it on 7 (renovate.json5).
services:
  server:
    image: solidproject/community-server:7.2.0@sha256:73465522db316ec2c7c0417bdf5b1b2eab432c70fab44fb25ba2f2098e21b9e5
    command: ["-c", "config/default.json", "-b", "http://127.0.0.1:${E2E_PORT:?}/", "-l", "warn"]
    ports: ["127.0.0.1:${E2E_PORT:?}:3000"]
    user: node
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 512
