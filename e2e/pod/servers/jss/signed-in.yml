# The same server, not open: its access control on (no --public), its
# identity provider on, each account's pod private to it (docs/testing.md).
services:
  tls:
    extends: { file: ../compose.tls.yml, service: tls }
    environment: { E2E_UPSTREAM: "4443" }
  server:
    extends: { file: compose.yml, service: server }
    command: !override [--conneg, --idp, --idp-issuer, "https://127.0.0.1:${E2E_PORT:?}/", --multi-user, --root, /data, --host, 0.0.0.0, --port, "4443"]
    ports: !reset []
    network_mode: "service:tls"
    depends_on: [tls]
    # Caddy's CA is made as it starts, and this server is thrown away after
    # the run: it trusts whatever certificate its own requests meet.
    environment: { NODE_TLS_REJECT_UNAUTHORIZED: "0" }
