# lychee's settings for the links in the project's Markdown
# (docs/testing.md#documentation): CI checks the files and anchors they
# point at on every change (--offline), and every web address weekly
# (.github/workflows/links.yml).

# A link to a heading must find it.
include_fragments = "full"

# The addresses a local server answers at (npm start, the journeys' server).
exclude_all_private = true

# Only the project's own Markdown: what npm installed is not ours to fix.
exclude_path = ["(^|/)node_modules/"]

no_progress = true

# Addresses that answer only once the maintainer does something, each to
# remove from this list then. The changelog's links to tags and
# comparisons are not among them: semantic-release writes them with the
# tag they name (docs/releasing.md), so each answers once the release is
# pushed.
exclude = [
  # The Client ID Document (docs/authentication.md), which the site has
  # once the release that writes it is deployed.
  "^https://solid-memo\\.com/clientid\\.jsonld$",
]
